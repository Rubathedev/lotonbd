<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LottoBD - Winners History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .btn-press {
            transition: all 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            user-select: none;
        }
        
        .btn-press:hover {
            transform: scale(0.98);
            filter: brightness(1.1);
        }
        
        .btn-press:active {
            transform: scale(0.85) translateY(2px);
        }
    </style>
</head>
<body class="bg-gradient-to-b from-teal-50 to-cyan-50 min-h-screen">
    <div class="w-full max-w-6xl mx-auto px-3 sm:px-4 md:px-6">
        <!-- HEADER -->
        <div class="bg-white rounded-xl shadow-md p-4 sm:p-6 mb-6 sm:mb-8 mt-4 sm:mt-6 border-2 border-teal-600">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-2xl sm:text-4xl font-bold text-teal-600">🏆 Winners History</h1>
                <a href="games.html" class="btn-press bg-teal-600 hover:bg-teal-700 text-white px-3 sm:px-4 py-2 rounded-lg font-bold border-2 border-teal-700 text-sm">
                    ← Back
                </a>
            </div>
        </div>

        <!-- DATE SELECTOR -->
        <div class="bg-white rounded-xl shadow-md p-4 sm:p-6 mb-6 sm:mb-8 border-2 border-teal-600">
            <h2 class="text-xl font-bold text-teal-700 mb-4">📅 Select Date</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
                <div>
                    <input type="date" id="filterDate" class="w-full p-3 border-2 border-teal-600 rounded-lg font-bold text-sm">
                </div>
                <button onclick="filterByDate()" class="btn-press bg-teal-600 hover:bg-teal-700 text-white p-3 rounded-lg font-bold border-2 border-teal-700">
                    🔍 Filter
                </button>
                <button onclick="showAllDates()" class="btn-press bg-gray-600 hover:bg-gray-700 text-white p-3 rounded-lg font-bold border-2 border-gray-700">
                    📋 All Dates
                </button>
            </div>

            <!-- Date Suggestions -->
            <div id="dateSuggestions" class="flex gap-2 flex-wrap">
                <!-- Populated by JavaScript -->
            </div>
        </div>

        <!-- WINNERS LIST BY DATE -->
        <div id="winnersList" class="space-y-4 sm:space-y-6">
            <!-- Populated by JavaScript -->
            <p class="text-center text-gray-600 py-8">Loading winners...</p>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://pnngnmbfbkbpzhsdpsmj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBubmdubWJmYmticHpoc2Rwc21qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NzU5MDgsImV4cCI6MjA4ODA1MTkwOH0.vIYdJA3eKajAGQ9Om27P8RkqTIeWUlGx1B-npq3u6u0';
        
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        let allWinners = [];
        let selectedDate = null;

        // Initialize
        supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            
            await loadAllWinners();
            generateDateSuggestions();
        });

        async function loadAllWinners() {
            try {
                // Get all completed games
                const { data: games } = await supabaseClient
                    .from('games')
                    .select('*')
                    .eq('status', 'completed')
                    .order('created_at', { ascending: false });

                allWinners = [];

                // For each game, get winners
                for (const game of games || []) {
                    const { data: transactions } = await supabaseClient
                        .from('transactions')
                        .select('*, users(name, email)')
                        .eq('game_id', game.id)
                        .eq('type', 'prize');

                    if (transactions && transactions.length > 0) {
                        for (const trans of transactions) {
                            allWinners.push({
                                date: new Date(game.created_at).toLocaleDateString('en-CA'), // YYYY-MM-DD format
                                dateDisplay: new Date(game.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }),
                                gameName: game.game_type === 'vip' ? '💎 VIP' : '🎮 Junior',
                                gameNumber: String(game.game_number).padStart(2, '0'),
                                gameId: game.id,
                                winnerName: trans.users.name,
                                winnerEmail: trans.users.email,
                                amount: trans.amount,
                                createdAt: new Date(game.created_at)
                            });
                        }
                    }
                }

                console.log('✅ Loaded', allWinners.length, 'winners');
                displayAllWinners();
            } catch (error) {
                console.error('Error loading winners:', error);
                document.getElementById('winnersList').innerHTML = '<p class="text-center text-red-600">Error loading winners</p>';
            }
        }

        function generateDateSuggestions() {
            const dates = [...new Set(allWinners.map(w => w.date))].sort().reverse();
            const container = document.getElementById('dateSuggestions');
            
            container.innerHTML = dates.slice(0, 7).map(date => {
                const dateObj = new Date(date + 'T00:00:00');
                const display = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                return `<button onclick="selectDate('${date}')" class="btn-press px-3 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-lg font-bold text-sm border-2 border-teal-700">${display}</button>`;
            }).join('');
        }

        window.selectDate = function(date) {
            selectedDate = date;
            document.getElementById('filterDate').value = date;
            displayWinnersByDate(date);
        };

        window.filterByDate = function() {
            const date = document.getElementById('filterDate').value;
            if (!date) {
                alert('Please select a date');
                return;
            }
            selectedDate = date;
            displayWinnersByDate(date);
        };

        window.showAllDates = function() {
            selectedDate = null;
            displayAllWinners();
        };

        function displayAllWinners() {
            if (allWinners.length === 0) {
                document.getElementById('winnersList').innerHTML = '<p class="text-center text-gray-600 py-8">No winners yet</p>';
                return;
            }

            // Group by date
            const grouped = {};
            allWinners.forEach(winner => {
                if (!grouped[winner.date]) {
                    grouped[winner.date] = [];
                }
                grouped[winner.date].push(winner);
            });

            const html = Object.keys(grouped)
                .sort()
                .reverse()
                .map(date => createDateSection(date, grouped[date]))
                .join('');

            document.getElementById('winnersList').innerHTML = html;
        }

        function displayWinnersByDate(date) {
            const winners = allWinners.filter(w => w.date === date);

            if (winners.length === 0) {
                document.getElementById('winnersList').innerHTML = `<p class="text-center text-gray-600 py-8">No winners on ${new Date(date + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</p>`;
                return;
            }

            document.getElementById('winnersList').innerHTML = createDateSection(date, winners);
        }

        function createDateSection(date, winners) {
            const dateObj = new Date(date + 'T00:00:00');
            const dateDisplay = dateObj.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const gameCount = new Set(winners.map(w => w.gameId)).size;

            return `
                <div class="bg-white rounded-xl shadow-md p-4 sm:p-6 border-2 border-teal-600">
                    <h3 class="text-lg sm:text-xl font-bold text-teal-700 mb-4">📅 ${dateDisplay}</h3>
                    <p class="text-sm text-gray-600 mb-4">🎮 ${gameCount} game(s) | 🏆 ${winners.length} winner(s)</p>
                    
                    <div class="space-y-3">
                        ${winners.map((winner, idx) => `
                            <div class="bg-gradient-to-r from-yellow-50 to-orange-50 p-4 rounded-lg border-l-4 border-yellow-500 flex justify-between items-start">
                                <div class="flex-1">
                                    <div class="flex items-center gap-3 mb-2">
                                        <span class="text-xl font-bold">${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '🎖️'}</span>
                                        <div>
                                            <p class="font-bold text-sm sm:text-base">${winner.winnerName}</p>
                                            <p class="text-xs text-gray-600">${winner.winnerEmail}</p>
                                        </div>
                                    </div>
                                    <p class="text-xs text-gray-600 ml-10">${winner.gameName} Game #${winner.gameNumber}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-2xl sm:text-3xl font-bold text-green-700">৳${winner.amount}</p>
                                    <p class="text-xs text-gray-600 mt-1">WON</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
