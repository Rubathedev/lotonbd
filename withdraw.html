<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LottoBD - Withdraw Money</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen p-4" style="background: linear-gradient(135deg, #E0F2F1 0%, #B2DFDB 100%);">
    <div class="max-w-2xl mx-auto">
        <!-- Header -->
        <div class="bg-white p-6 rounded-lg border-2 border-teal-600 mb-6 shadow-lg">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-teal-700">🏧 Withdraw Money</h1>
                <a href="games.html" class="bg-teal-600 text-white px-4 py-2 rounded hover:bg-teal-700 font-bold">← Back</a>
            </div>
        </div>

        <!-- Balance Section -->
        <div class="bg-white p-6 rounded-lg border-2 border-teal-600 mb-6 shadow-lg">
            <p class="text-gray-600 text-lg">Available Balance:</p>
            <p class="text-4xl font-bold text-teal-600">৳<span id="userBalance">0</span></p>
        </div>

        <!-- Withdrawal Request Section -->
        <div class="bg-white p-6 rounded-lg border-2 border-green-600 mb-6 shadow-lg">
            <h2 class="text-2xl font-bold text-green-700 mb-6">Request Withdrawal</h2>

            <!-- Amount Input -->
            <div class="mb-4">
                <label class="block text-green-700 font-bold mb-2">Amount (Minimum ৳500)</label>
                <input type="number" id="withdrawAmount" placeholder="Enter amount" min="500" 
                    class="w-full px-4 py-3 bg-green-50 border-2 border-green-500 rounded text-gray-800 focus:outline-none focus:border-green-700">
                <p class="text-sm text-gray-600 mt-2">Must be at least ৳500</p>
            </div>

            <!-- Payment Method -->
            <div class="mb-4">
                <label class="block text-green-700 font-bold mb-2">Payment Method</label>
                <select id="paymentMethod" class="w-full px-4 py-3 bg-green-50 border-2 border-green-500 rounded text-gray-800 focus:outline-none">
                    <option value="bkash">bKash</option>
                    <option value="nagad">Nagad</option>
                    <option value="rocket">Rocket</option>
                    <option value="bank">Bank Transfer</option>
                </select>
            </div>

            <!-- Account Number / Phone -->
            <div class="mb-6">
                <label class="block text-green-700 font-bold mb-2">📱 Account Number / Phone</label>
                <input type="text" id="accountNumber" placeholder="01XXXXXXXXX" 
                    class="w-full px-4 py-3 bg-green-50 border-2 border-green-500 rounded text-gray-800 focus:outline-none focus:border-green-700">
                <p class="text-sm text-gray-600 mt-2">Enter your bKash/Nagad/Rocket number or Bank account number</p>
            </div>

            <!-- Submit Button -->
            <button onclick="submitWithdrawal()" class="w-full bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded font-bold text-lg mb-2">
                ✅ Submit Request
            </button>

            <!-- Info -->
            <p class="text-center text-gray-600 text-sm">* Withdrawals are processed within 24-48 hours</p>
        </div>

        <!-- Withdrawal History -->
        <div class="bg-white p-6 rounded-lg border-2 border-teal-600 shadow-lg">
            <h2 class="text-2xl font-bold text-teal-700 mb-4">📋 Withdrawal History</h2>
            <div id="withdrawalHistory" class="space-y-3">
                <p class="text-gray-600 text-center py-8">Loading history...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://pnngnmbfbkbpzhsdpsmj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBubmdubWJmYmticHpoc2Rwc21qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NzU5MDgsImV4cCI6MjA4ODA1MTkwOH0.vIYdJA3eKajAGQ9Om27P8RkqTIeWUlGx1B-npq3u6u0';
        
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let userBalance = 0;

        // Initialize
        supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
            if (!session) {
                window.location.href = 'index.html';
                return;
            }

            currentUser = session.user;
            await loadUserBalance();
            await loadWithdrawalHistory();
        });

        async function loadUserBalance() {
            try {
                const { data } = await supabaseClient
                    .from('users')
                    .select('balance')
                    .eq('id', currentUser.id)
                    .single();

                if (data) {
                    userBalance = data.balance;
                    document.getElementById('userBalance').textContent = userBalance;
                }
            } catch (error) {
                console.error('Load balance error:', error);
            }
        }

        async function loadWithdrawalHistory() {
            try {
                const { data } = await supabaseClient
                    .from('withdrawals')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('created_at', { ascending: false });

                const historyDiv = document.getElementById('withdrawalHistory');

                if (!data || data.length === 0) {
                    historyDiv.innerHTML = '<p class="text-gray-600 text-center py-8">No withdrawal history</p>';
                    return;
                }

                historyDiv.innerHTML = '';
                data.forEach(withdrawal => {
                    const statusColor = withdrawal.status === 'pending' ? 'bg-yellow-100 border-yellow-500' : 
                                       withdrawal.status === 'completed' ? 'bg-green-100 border-green-500' : 'bg-red-100 border-red-500';
                    const statusEmoji = withdrawal.status === 'pending' ? '⏳' : 
                                       withdrawal.status === 'completed' ? '✅' : '❌';

                    const date = new Date(withdrawal.created_at).toLocaleDateString('en-GB', { 
                        day: '2-digit', 
                        month: 'short', 
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    historyDiv.innerHTML += `
                        <div class="${statusColor} p-4 rounded-lg border-2">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="font-bold text-gray-800">৳${withdrawal.amount}</p>
                                    <p class="text-sm text-gray-600">${withdrawal.method.toUpperCase()}</p>
                                    <p class="text-sm text-gray-600">${withdrawal.account}</p>
                                    <p class="text-xs text-gray-500">${date}</p>
                                </div>
                                <span class="text-2xl">${statusEmoji}</span>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Load history error:', error);
            }
        }

        window.submitWithdrawal = async function() {
            const amount = parseInt(document.getElementById('withdrawAmount').value);
            const method = document.getElementById('paymentMethod').value;
            const account = document.getElementById('accountNumber').value.trim();

            // Validation
            if (!amount || amount < 500) {
                alert('❌ Minimum withdrawal is ৳500');
                return;
            }

            if (!account || account.length < 5) {
                alert('❌ Please enter a valid account number/phone');
                return;
            }

            if (amount > userBalance) {
                alert(`❌ Insufficient balance! You have ৳${userBalance}`);
                return;
            }

            if (!confirm(`Request withdrawal of ৳${amount}?\n\nMethod: ${method.toUpperCase()}\nAccount: ${account}`)) {
                return;
            }

            try {
                // Create withdrawal request
                const { error } = await supabaseClient.from('withdrawals').insert({
                    user_id: currentUser.id,
                    amount: amount,
                    method: method,
                    account: account,
                    status: 'pending'
                });

                if (error) throw error;

                // Deduct from balance
                const newBalance = userBalance - amount;
                await supabaseClient
                    .from('users')
                    .update({ balance: newBalance })
                    .eq('id', currentUser.id);

                // Record transaction
                await supabaseClient.from('transactions').insert({
                    user_id: currentUser.id,
                    type: 'withdrawal',
                    amount: -amount
                });

                alert(`✅ Withdrawal request submitted!\n\nAmount: ৳${amount}\nStatus: Pending\nYou will receive the money within 24-48 hours`);

                // Clear form
                document.getElementById('withdrawAmount').value = '';
                document.getElementById('accountNumber').value = '';

                // Refresh
                await loadUserBalance();
                await loadWithdrawalHistory();

            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };

        // Refresh every 10 seconds
        setInterval(() => {
            loadUserBalance();
            loadWithdrawalHistory();
        }, 10000);
    </script>
</body>
</html>
