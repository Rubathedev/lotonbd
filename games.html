<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LottoBD - Play Games</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .btn-press {
            transition: all 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            user-select: none;
        }
        
        .btn-press:hover {
            transform: scale(0.98);
            filter: brightness(1.1);
        }
        
        .btn-press:active {
            transform: scale(0.85) translateY(2px);
        }
    </style>
</head>
<body class="bg-gradient-to-b from-teal-50 to-cyan-50 min-h-screen">
    <div class="max-w-6xl mx-auto px-4">
        <!-- HEADER -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 mt-6 border-2 border-teal-600">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-4xl font-bold text-teal-600">🎫 LottoBD</h1>
                
                <div class="flex gap-2">
                    <div class="flex gap-1 bg-gray-200 p-1 rounded-lg">
                        <button onclick="setLanguage('en')" id="btnEn" class="btn-press bg-blue-600 text-white px-4 py-2 rounded font-bold text-sm">EN</button>
                        <button onclick="setLanguage('bn')" id="btnBn" class="btn-press bg-gray-400 text-white px-4 py-2 rounded font-bold text-sm">বাং</button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-4 gap-4">
                <div class="bg-green-100 p-4 rounded-lg border-2 border-green-500">
                    <p class="text-xs font-bold text-gray-700">BALANCE</p>
                    <p class="text-3xl font-bold text-green-700">৳<span id="userBalance">0</span></p>
                </div>

                <a href="profile.html" class="btn-press bg-teal-600 hover:bg-teal-700 text-white p-4 rounded-lg font-bold text-center border-2 border-teal-700">
                    👤 Profile
                </a>

                <a href="withdraw.html" class="btn-press bg-teal-600 hover:bg-teal-700 text-white p-4 rounded-lg font-bold text-center border-2 border-teal-700">
                    🏧 Withdraw
                </a>

                <a href="winners.html" class="btn-press bg-teal-600 hover:bg-teal-700 text-white p-4 rounded-lg font-bold text-center border-2 border-teal-700">
                    🏆 Winners
                </a>
            </div>
        </div>

        <!-- GAMES SECTION -->
        <div id="gamesContent" class="space-y-8 pb-12">
            <!-- Junior Games -->
            <div>
                <h2 class="text-3xl font-bold text-teal-700 mb-6">🎮 Junior Games</h2>
                <div id="juniorGamesList" class="grid grid-cols-5 gap-4">
                    <p class="text-center text-gray-600 col-span-full py-8">Loading...</p>
                </div>
            </div>

            <!-- VIP Games -->
            <div>
                <h2 class="text-3xl font-bold text-teal-700 mb-6">💎 VIP Games</h2>
                <div id="vipGamesList" class="grid grid-cols-5 gap-4">
                    <p class="text-center text-gray-600 col-span-full py-8">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- BUY MODAL -->
    <div id="buyModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl p-8 max-w-md w-full shadow-2xl border-2 border-teal-600">
            <h2 class="text-2xl font-bold text-teal-700 mb-6">Buy Tickets</h2>
            
            <div class="bg-green-100 p-4 rounded-lg border-2 border-green-500 mb-6">
                <p class="text-sm text-gray-700">Price per ticket</p>
                <p id="ticketPrice" class="text-3xl font-bold text-green-700">৳200</p>
            </div>

            <div class="mb-6">
                <label class="block font-bold mb-3">How many tickets?</label>
                <div class="flex gap-2">
                    <button onclick="buyTickets(1)" class="btn-press flex-1 bg-teal-600 hover:bg-teal-700 text-white p-4 rounded-lg font-bold border-2 border-teal-700">1</button>
                    <button onclick="buyTickets(2)" class="btn-press flex-1 bg-teal-600 hover:bg-teal-700 text-white p-4 rounded-lg font-bold border-2 border-teal-700">2</button>
                    <button onclick="buyTickets(3)" class="btn-press flex-1 bg-teal-600 hover:bg-teal-700 text-white p-4 rounded-lg font-bold border-2 border-teal-700">3</button>
                </div>
            </div>

            <div class="bg-yellow-50 p-4 rounded-lg border-2 border-yellow-400 mb-6">
                <p class="text-sm text-gray-700">Total Cost</p>
                <p id="totalCost" class="text-2xl font-bold text-yellow-700">৳200</p>
            </div>

            <button onclick="closeBuyModal()" class="btn-press w-full bg-gray-500 hover:bg-gray-600 text-white px-4 py-3 rounded-lg font-bold border-2 border-gray-700">
                Cancel
            </button>
        </div>
    </div>

    <!-- RESULTS MODAL -->
    <div id="resultsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl p-8 max-w-2xl w-full shadow-2xl border-2 border-teal-600 max-h-96 overflow-y-auto">
            <h2 class="text-3xl font-bold text-teal-700 mb-6 text-center">🏆 Game Results</h2>
            
            <div class="mb-6">
                <h3 class="text-xl font-bold text-green-700 mb-4">🥇 WINNERS</h3>
                <div id="winnersList" class="space-y-3 mb-6"></div>
            </div>

            <div class="mb-6">
                <h3 class="text-xl font-bold text-gray-700 mb-4">📋 Other Players</h3>
                <div id="losersList" class="space-y-2"></div>
            </div>

            <button onclick="closeResultsModal()" class="btn-press w-full bg-teal-600 hover:bg-teal-700 text-white px-6 py-3 rounded-lg font-bold border-2 border-teal-700">
                Back to Games
            </button>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://pnngnmbfbkbpzhsdpsmj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBubmdubWJmYmticHpoc2Rwc21qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NzU5MDgsImV4cCI6MjA4ODA1MTkwOH0.vIYdJA3eKajAGQ9Om27P8RkqTIeWUlGx1B-npq3u6u0';
        
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let userBalance = 0;
        let currentLanguage = localStorage.getItem('lottobdLanguage') || 'en';
        let currentGame = null;
        let currentGameType = null;

        const PRIZES = {
            junior: [500, 300, 200, 100, 100, 100],
            vip: [3000, 2000, 1000, 500, 500, 500, 500]
        };

        const translations = {
            en: {
                insufficientBalance: 'Insufficient balance!',
                ticketsPurchased: 'Tickets purchased successfully!'
            },
            bn: {
                insufficientBalance: 'অপর্যাপ্ত ব্যালেন্স!',
                ticketsPurchased: 'টিকিট সফলভাবে ক্রয় করা হয়েছে!'
            }
        };

        // Initialize
        supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
            if (!session) {
                window.location.href = 'index.html';
                return;
            }

            currentUser = session.user;
            await loadUserBalance();
            await loadGames();
        });

        window.setLanguage = function(lang) {
            currentLanguage = lang;
            localStorage.setItem('lottobdLanguage', lang);
        };

        async function loadUserBalance() {
            try {
                const { data } = await supabaseClient
                    .from('users')
                    .select('balance')
                    .eq('id', currentUser.id)
                    .single();

                if (data) {
                    userBalance = data.balance;
                    document.getElementById('userBalance').textContent = userBalance;
                }
            } catch (error) {
                console.error('Load balance error:', error);
            }
        }

        async function loadGames() {
            try {
                const { data } = await supabaseClient
                    .from('games')
                    .select('*')
                    .eq('status', 'active')
                    .order('game_type')
                    .order('game_number');

                const juniorList = document.getElementById('juniorGamesList');
                const vipList = document.getElementById('vipGamesList');

                const juniorGames = data.filter(g => g.game_type === 'junior') || [];
                const vipGames = data.filter(g => g.game_type === 'vip') || [];

                juniorList.innerHTML = juniorGames.length ? juniorGames.map(createGameCard).join('') : '<p class="col-span-full text-center text-gray-600">No games available</p>';
                vipList.innerHTML = vipGames.length ? vipGames.map(createGameCard).join('') : '<p class="col-span-full text-center text-gray-600">No games available</p>';
            } catch (error) {
                console.error('Load games error:', error);
            }
        }

        function createGameCard(game) {
            const gameNum = String(game.game_number).padStart(2, '0');
            const sold = game.tickets_sold || 0;
            const isJunior = game.game_type === 'junior';
            const percentFull = (sold / 10) * 100;
            const price = isJunior ? '200' : '1,000';
            const statusBg = sold >= 10 ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700';
            const statusText = sold >= 10 ? 'FULL' : 'OPEN';
            const isDisabled = sold >= 10;
            const opacityClass = isDisabled ? 'opacity-60 cursor-not-allowed' : '';
            const clickHandler = isDisabled ? 'onclick="alert(\'❌ Game is FULL!\')"' : `onclick="selectGame('${game.id}', '${game.game_type}')"`;

            return `
                <button ${clickHandler} class="btn-press bg-gradient-to-br from-teal-100 to-cyan-100 p-5 rounded-xl border-2 border-teal-600 shadow-lg ${opacityClass}">
                    <p class="text-teal-700 font-bold text-xl mb-2">#${gameNum}</p>
                    <p class="text-sm text-gray-600 mb-3">${sold}/10</p>
                    <div class="w-full bg-gray-300 rounded-full h-3 mb-3">
                        <div class="bg-teal-600 h-3 rounded-full" style="width: ${percentFull}%"></div>
                    </div>
                    <p class="font-bold text-lg text-gray-800 mb-2">৳${price}</p>
                    <p class="${statusBg} text-xs font-bold px-3 py-1 rounded-lg text-center">${statusText}</p>
                </button>
            `;
        }

        window.selectGame = function(gameId, gameType) {
            currentGame = gameId;
            currentGameType = gameType;
            const price = gameType === 'vip' ? 1000 : 200;
            document.getElementById('ticketPrice').textContent = '৳' + price;
            document.getElementById('totalCost').textContent = '৳' + price;
            document.getElementById('buyModal').classList.remove('hidden');
        };

        window.closeBuyModal = function() {
            document.getElementById('buyModal').classList.add('hidden');
        };

        window.buyTickets = async function(count) {
            if (count > 3) {
                alert('❌ Maximum 3 tickets per game!');
                return;
            }

            const ticketPrice = currentGameType === 'vip' ? 1000 : 200;
            const totalPrice = ticketPrice * count;

            if (userBalance < totalPrice) {
                alert('❌ ' + translations[currentLanguage].insufficientBalance);
                return;
            }

            try {
                const [gameResult, myTicketsResult, allTicketsResult] = await Promise.all([
                    supabaseClient.from('games').select('tickets_sold, status').eq('id', currentGame).single(),
                    supabaseClient.from('tickets').select('id').eq('game_id', currentGame).eq('user_id', currentUser.id),
                    supabaseClient.from('tickets').select('ticket_number').eq('game_id', currentGame)
                ]);

                const gameData = gameResult.data;
                const myTickets = myTicketsResult.data || [];
                const allTickets = allTicketsResult.data || [];

                if (gameData.tickets_sold >= 10) {
                    alert('❌ Game is FULL!');
                    closeBuyModal();
                    return;
                }

                const myTicketCount = myTickets.length;
                if (myTicketCount >= 3) {
                    alert('❌ You already have 3 tickets!');
                    closeBuyModal();
                    return;
                }

                if (myTicketCount + count > 3) {
                    alert(`❌ You can only buy ${3 - myTicketCount} more!`);
                    closeBuyModal();
                    return;
                }

                const soldNumbers = new Set(allTickets.map(t => t.ticket_number));
                const availableNumbers = [];
                for (let i = 1; i <= 10; i++) {
                    if (!soldNumbers.has(i)) availableNumbers.push(i);
                }

                if (availableNumbers.length < count) {
                    alert('❌ Not enough tickets!');
                    return;
                }

                const ticketInserts = [];
                const transactionInserts = [];
                const assignedNumbers = [];

                for (let i = 0; i < count; i++) {
                    const randomIndex = Math.floor(Math.random() * availableNumbers.length);
                    const ticketNum = availableNumbers.splice(randomIndex, 1)[0];
                    assignedNumbers.push(ticketNum);

                    ticketInserts.push({
                        game_id: currentGame,
                        user_id: currentUser.id,
                        ticket_number: ticketNum
                    });

                    transactionInserts.push({
                        user_id: currentUser.id,
                        type: 'ticket_purchase',
                        amount: -ticketPrice,
                        game_id: currentGame,
                        ticket_number: ticketNum
                    });
                }

                const newCount = (gameData.tickets_sold || 0) + count;

                const [ticketsRes, transRes, balRes, gameRes] = await Promise.all([
                    supabaseClient.from('tickets').insert(ticketInserts),
                    supabaseClient.from('transactions').insert(transactionInserts),
                    supabaseClient.from('users').update({ balance: userBalance - totalPrice }).eq('id', currentUser.id),
                    supabaseClient.from('games').update({ tickets_sold: newCount }).eq('id', currentGame)
                ]);

                if (ticketsRes.error || transRes.error || balRes.error || gameRes.error) {
                    alert('❌ Error! Try again.');
                    return;
                }

                userBalance -= totalPrice;
                document.getElementById('userBalance').textContent = userBalance;
                alert('✅ ' + translations[currentLanguage].ticketsPurchased + '\n\n🎫 Numbers: ' + assignedNumbers.join(', '));
                closeBuyModal();

                if (newCount === 10) {
                    setTimeout(() => selectWinnersAndDistributePrizes(currentGame, currentGameType), 2000);
                } else {
                    loadGames();
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };

        window.selectWinnersAndDistributePrizes = async function(gameId, gameType) {
            try {
                const { data: allTickets } = await supabaseClient
                    .from('tickets')
                    .select('*, users(id, name, email)')
                    .eq('game_id', gameId);

                if (!allTickets || allTickets.length === 0) return;

                const prizes = PRIZES[gameType];
                const shuffled = [...allTickets].sort(() => Math.random() - 0.5);
                const winners = shuffled.slice(0, prizes.length);

                for (let i = 0; i < winners.length; i++) {
                    const winner = winners[i];
                    const prizeAmount = prizes[i];

                    const { data: userData } = await supabaseClient
                        .from('users')
                        .select('balance, total_earned')
                        .eq('id', winner.user_id)
                        .single();

                    await supabaseClient.from('users').update({
                        balance: (userData.balance || 0) + prizeAmount,
                        total_earned: (userData.total_earned || 0) + prizeAmount
                    }).eq('id', winner.user_id);

                    await supabaseClient.from('transactions').insert({
                        user_id: winner.user_id,
                        type: 'prize',
                        amount: prizeAmount,
                        game_id: gameId,
                        ticket_number: winner.ticket_number
                    });
                }

                await supabaseClient.from('games').update({ status: 'completed' }).eq('id', gameId);
                showGameResults(gameType, winners, allTickets);
            } catch (error) {
                console.error('Error:', error);
            }
        };

        window.showGameResults = function(gameType, winners, allTickets) {
            const winnersList = document.getElementById('winnersList');
            winnersList.innerHTML = '';
            const medals = ['🥇', '🥈', '🥉', '🎖️', '🎖️', '🎖️', '🎖️'];
            const prizes = PRIZES[gameType];

            winners.forEach((winner, index) => {
                winnersList.innerHTML += `
                    <div class="bg-green-100 p-4 rounded-lg border-2 border-green-500">
                        <p class="font-bold">${medals[index]} ${winner.users.name}</p>
                        <p class="text-sm text-gray-600">${winner.users.email}</p>
                        <p class="text-2xl font-bold text-green-700 mt-2">৳${prizes[index]}</p>
                    </div>
                `;
            });

            const losersList = document.getElementById('losersList');
            const winnerIds = new Set(winners.map(w => w.user_id));
            const losers = allTickets.filter(t => !winnerIds.has(t.user_id));

            losersList.innerHTML = losers.map(loser => `
                <div class="bg-gray-100 p-3 rounded border-l-4 border-gray-400">
                    <p class="font-bold text-sm">${loser.users.name}</p>
                </div>
            `).join('');

            document.getElementById('resultsModal').classList.remove('hidden');
        };

        window.closeResultsModal = function() {
            document.getElementById('resultsModal').classList.add('hidden');
            loadUserBalance();
            loadGames();
        };

        setInterval(() => {
            loadUserBalance();
            loadGames();
        }, 5000);
    </script>
</body>
</html>
