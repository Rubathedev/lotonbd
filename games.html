<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LottoBD - Games</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%); }
        .glow { box-shadow: 0 0 20px rgba(34, 197, 94, 0.5); }
        .ticket { transition: all 0.3s; cursor: pointer; }
        .ticket-available:hover { transform: scale(1.1); box-shadow: 0 0 15px rgba(34, 197, 94, 0.8); }
        .ticket-mine { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); color: black; }
        .ticket-sold { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body class="min-h-screen p-4">
    <div class="max-w-7xl mx-auto">
        <div class="bg-gray-900 p-6 rounded-lg border border-green-500 mb-6">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold text-green-400">🎰 LottoBD</h1>
                    <p class="text-gray-400" id="userName">Loading...</p>
                </div>
                <div class="flex gap-3">
                    <a href="profile.html" class="bg-gray-800 text-green-400 px-4 py-2 rounded border border-green-500">Profile</a>
                    <button onclick="logout()" class="bg-red-600 text-white px-4 py-2 rounded">Logout</button>
                </div>
            </div>
        </div>

        <div class="bg-gray-900 p-4 rounded-lg border border-green-500 mb-6 glow">
            <div class="flex justify-between items-center">
                <span class="text-green-400">Your Balance:</span>
                <span class="text-3xl font-bold text-white" id="userBalance">৳0</span>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6" id="gamesList">
            <div class="text-center text-gray-400">Loading games...</div>
        </div>

        <div id="gameContainer" class="hidden">
            <div class="bg-gray-900 p-6 rounded-lg border border-green-500 mb-4">
                <h2 class="text-xl font-bold text-green-400 mb-2" id="gameTitle">Game #001</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                    <div>
                        <p class="text-gray-400">Sold</p>
                        <p class="text-2xl font-bold text-white" id="soldCount">0/100</p>
                    </div>
                    <div>
                        <p class="text-gray-400">My Tickets</p>
                        <p class="text-2xl font-bold text-green-400" id="myTicketCount">0/10</p>
                    </div>
                    <div>
                        <p class="text-gray-400">Ticket Price</p>
                        <p class="text-2xl font-bold text-white">৳100</p>
                    </div>
                    <div>
                        <p class="text-gray-400">Prize Pool</p>
                        <p class="text-2xl font-bold text-white">৳8,000</p>
                    </div>
                </div>
            </div>

            <div class="bg-gray-900 p-6 rounded-lg border border-green-500">
                <h3 class="text-lg font-bold text-green-400 mb-4">Pick Your Lucky Numbers (Max 10)</h3>
                <div id="numbersGrid" class="grid grid-cols-10 gap-2"></div>
                <div class="mt-4 flex gap-2">
                    <span class="flex items-center gap-2"><div class="w-6 h-6 bg-green-500 rounded"></div> Your Tickets</span>
                    <span class="flex items-center gap-2"><div class="w-6 h-6 bg-gray-600 rounded"></div> Sold</span>
                    <span class="flex items-center gap-2"><div class="w-6 h-6 bg-gray-800 border border-green-500 rounded"></div> Available</span>
                </div>
            </div>
        </div>

        <div id="winnerModal" class="hidden fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center z-50">
            <div class="bg-gray-900 p-8 rounded-lg border border-green-500 max-w-2xl max-h-screen overflow-y-auto">
                <div id="winnerResults"></div>
                <button onclick="closeWinnerModal()" class="mt-6 w-full bg-green-500 text-black font-bold py-3 rounded">Close</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://pnngnmbfbkbpzhsdpsmj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBubmdubWJmYmticHpoc2Rwc21qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NzU5MDgsImV4cCI6MjA4ODA1MTkwOH0.vIYdJA3eKajAGQ9Om27P8RkqTIeWUlGx1B-npq3u6u0';
        
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let currentGame = null;
        let userBalance = 0;
        let myTickets = [];

        supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = session.user;
            await loadUserData();
            await loadGames();
        });

        async function loadUserData() {
            const { data, error } = await supabaseClient
                .from('users')
                .select('*')
                .eq('id', currentUser.id)
                .single();

            if (error && error.code === 'PGRST116') {
                await supabaseClient.from('users').insert({
                    id: currentUser.id,
                    email: currentUser.email,
                    name: currentUser.user_metadata.full_name || currentUser.email.split('@')[0],
                    balance: 0,
                    total_earned: 0
                });
                userBalance = 0;
            } else if (data) {
                userBalance = data.balance;
                document.getElementById('userName').textContent = `Hi, ${data.name}!`;
            }
            
            document.getElementById('userBalance').textContent = `৳${userBalance}`;
        }

        async function loadGames() {
            const today = new Date().toISOString().split('T')[0];
            const { data, error } = await supabaseClient
                .from('games')
                .select('*')
                .eq('date', today)
                .eq('status', 'active')
                .order('game_number', { ascending: true });

            const gamesDiv = document.getElementById('gamesList');
            
            if (!data || data.length === 0) {
                gamesDiv.innerHTML = '<div class="col-span-full text-center text-gray-400">No games available today. Check back later!</div>';
                return;
            }

            gamesDiv.innerHTML = '';
            data.forEach(game => {
                const sold = game.tickets_sold || 0;
                gamesDiv.innerHTML += `
                    <div class="bg-gray-800 p-4 rounded-lg border border-green-500 cursor-pointer hover:bg-gray-700" onclick="selectGame('${game.id}')">
                        <h3 class="text-lg font-bold text-green-400">Game #${game.game_number}</h3>
                        <p class="text-sm text-gray-400">Tickets: ${sold}/100</p>
                        <div class="mt-2 bg-gray-700 rounded-full h-2">
                            <div class="bg-green-500 h-2 rounded-full" style="width: ${sold}%"></div>
                        </div>
                        ${sold < 100 ? '<p class="mt-2 text-green-400 text-sm">🎫 Buy Now!</p>' : '<p class="mt-2 text-yellow-400 text-sm">🔒 Full</p>'}
                    </div>
                `;
            });
        }

        window.selectGame = async function(gameId) {
            currentGame = gameId;
            const { data } = await supabaseClient.from('games').select('*').eq('id', gameId).single();
            
            document.getElementById('gameTitle').textContent = `Game #${data.game_number}`;
            document.getElementById('soldCount').textContent = `${data.tickets_sold || 0}/100`;
            document.getElementById('gameContainer').classList.remove('hidden');
            
            await loadTickets();
            window.scrollTo({ top: document.getElementById('gameContainer').offsetTop, behavior: 'smooth' });
        };

        async function loadTickets() {
            const { data } = await supabaseClient
                .from('tickets')
                .select('*')
                .eq('game_id', currentGame);

            const soldTickets = {};
            myTickets = [];
            
            data?.forEach(ticket => {
                soldTickets[ticket.ticket_number] = ticket.user_id;
                if (ticket.user_id === currentUser.id) {
                    myTickets.push(ticket.ticket_number);
                }
            });

            document.getElementById('myTicketCount').textContent = `${myTickets.length}/10`;

            const grid = document.getElementById('numbersGrid');
            grid.innerHTML = '';
            
            for (let i = 1; i <= 100; i++) {
                const div = document.createElement('div');
                div.className = 'ticket text-center p-3 rounded font-bold border-2';
                div.textContent = i;
                
                if (soldTickets[i]) {
                    if (soldTickets[i] === currentUser.id) {
                        div.className += ' ticket-mine';
                    } else {
                        div.className += ' ticket-sold bg-gray-700 border-gray-600 text-gray-500';
                    }
                } else {
                    div.className += ' ticket-available bg-gray-800 border-green-500 text-green-400';
                    div.onclick = () => buyTicket(i);
                }
                
                grid.appendChild(div);
            }
        }

        async function buyTicket(number) {
            if (myTickets.length >= 10) {
                alert('Maximum 10 tickets per game!');
                return;
            }
            
            if (userBalance < 100) {
                alert('Insufficient balance! Please add money.');
                return;
            }

            if (!confirm(`Buy ticket #${number} for ৳100?`)) return;

            try {
                const { error: balanceError } = await supabaseClient
                    .from('users')
                    .update({ balance: userBalance - 100 })
                    .eq('id', currentUser.id);

                if (balanceError) throw balanceError;

                const { error: ticketError } = await supabaseClient
                    .from('tickets')
                    .insert({
                        game_id: currentGame,
                        user_id: currentUser.id,
                        ticket_number: number
                    });

                if (ticketError) throw ticketError;

                const { data: gameData } = await supabaseClient
                    .from('games')
                    .select('tickets_sold')
                    .eq('id', currentGame)
                    .single();

                const newCount = (gameData.tickets_sold || 0) + 1;
                await supabaseClient
                    .from('games')
                    .update({ tickets_sold: newCount })
                    .eq('id', currentGame);

                await supabaseClient.from('transactions').insert({
                    user_id: currentUser.id,
                    type: 'ticket_purchase',
                    amount: -100,
                    game_id: currentGame,
                    ticket_number: number
                });

                userBalance -= 100;
                document.getElementById('userBalance').textContent = `৳${userBalance}`;
                document.getElementById('soldCount').textContent = `${newCount}/100`;
                
                await loadTickets();
                alert(`Ticket #${number} purchased! Good luck! 🍀`);

                if (newCount === 100) {
                    setTimeout(async () => {
                        alert('🎰 Game is FULL! Selecting winners now...');
                        await autoPickWinners(currentGame);
                    }, 2000);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function autoPickWinners(gameId) {
            try {
                const { data: tickets } = await supabaseClient
                    .from('tickets')
                    .select('*')
                    .eq('game_id', gameId);
                
                if (tickets.length !== 100) {
                    console.error('Not exactly 100 tickets!');
                    return;
                }

                const shuffled = tickets.sort(() => Math.random() - 0.5);
                const winners = shuffled.slice(0, 26);

                const prizes = [
                    ...Array(2).fill(1000),
                    ...Array(4).fill(500),
                    ...Array(20).fill(200)
                ];

                for (let i = 0; i < 26; i++) {
                    const winner = winners[i];
                    const prize = prizes[i];

                    const { data: user } = await supabaseClient
                        .from('users')
                        .select('balance, total_earned')
                        .eq('id', winner.user_id)
                        .single();
                    
                    await supabaseClient.from('users').update({
                        balance: user.balance + prize,
                        total_earned: user.total_earned + prize
                    }).eq('id', winner.user_id);

                    await supabaseClient.from('transactions').insert({
                        user_id: winner.user_id,
                        type: 'prize',
                        amount: prize,
                        game_id: gameId,
                        ticket_number: winner.ticket_number
                    });
                }

                await supabaseClient.from('games').update({ 
                    status: 'completed' 
                }).eq('id', gameId);

                showWinnerResults(winners, prizes);
                
                console.log('Winners selected and prizes distributed!');
            } catch (error) {
                console.error('Auto-pick winners error:', error);
                alert('Error selecting winners: ' + error.message);
            }
        }

        function showWinnerResults(winners, prizes) {
            const modal = document.getElementById('winnerModal');
            const resultsDiv = document.getElementById('winnerResults');
            
            let html = '<h3 class="text-3xl font-bold text-green-400 mb-6 text-center">🎉 WINNERS ANNOUNCED! 🎉</h3>';
            
            html += '<div class="mb-6 bg-yellow-900 bg-opacity-30 p-4 rounded"><h4 class="text-xl font-bold text-yellow-400 mb-2">🥇 1ST PRIZE - ৳1,000 each:</h4>';
            for (let i = 0; i < 2; i++) {
                const isMe = winners[i].user_id === currentUser.id;
                html += `<p class="${isMe ? 'text-green-400 font-bold text-2xl' : 'text-white text-lg'}">
                    🎫 Ticket #${winners[i].ticket_number} ${isMe ? '← 🎉 YOU WON ৳1,000! 🎉' : ''}
                </p>`;
            }
            html += '</div>';
            
            html += '<div class="mb-6 bg-orange-900 bg-opacity-30 p-4 rounded"><h4 class="text-xl font-bold text-orange-400 mb-2">🥈 2ND PRIZE - ৳500 each:</h4>';
            for (let i = 2; i < 6; i++) {
                const isMe = winners[i].user_id === currentUser.id;
                html += `<p class="${isMe ? 'text-green-400 font-bold text-xl' : 'text-white'}">
                    🎫 Ticket #${winners[i].ticket_number} ${isMe ? '← 🎉 YOU WON ৳500! 🎉' : ''}
                </p>`;
            }
            html += '</div>';
            
            html += '<div class="mb-6 bg-blue-900 bg-opacity-30 p-4 rounded"><h4 class="text-xl font-bold text-blue-400 mb-2">🥉 3RD PRIZE - ৳200 each:</h4>';
            html += '<div class="grid grid-cols-2 gap-2">';
            for (let i = 6; i < 26; i++) {
                const isMe = winners[i].user_id === currentUser.id;
                html += `<p class="${isMe ? 'text-green-400 font-bold' : 'text-gray-300'}">
                    🎫 #${winners[i].ticket_number} ${isMe ? '← YOU WON!' : ''}
                </p>`;
            }
            html += '</div></div>';
            
            html += '<p class="text-center text-gray-400 mt-6">Prize money has been added to winners\' balances!</p>';
            html += '<p class="text-center text-green-400 mt-2">Redirecting in 10 seconds...</p>';
            
            resultsDiv.innerHTML = html;
            modal.classList.remove('hidden');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                window.location.reload();
            }, 10000);
        }

        window.logout = async function() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        };

        window.closeWinnerModal = function() {
            document.getElementById('winnerModal').classList.add('hidden');
        };
    </script>
</body>
</html>
