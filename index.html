<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LottoBD - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4" style="background: linear-gradient(135deg, #E0F2F1 0%, #B2DFDB 100%);">
    <div class="w-full max-w-md">
        <div class="bg-white p-8 rounded-lg border-2 border-teal-600 shadow-lg">
            <div class="text-center mb-6">
                <h1 class="text-4xl font-bold text-teal-600 mb-2">🎰 LottoBD</h1>
                <p class="text-gray-600">Bangladesh Lottery System</p>
            </div>

            <div class="mb-4">
                <label class="block text-teal-700 font-bold mb-2">Email</label>
                <input type="email" id="email" placeholder="your@email.com" 
                    class="w-full px-4 py-3 bg-teal-50 border-2 border-teal-600 rounded focus:outline-none focus:border-teal-700">
            </div>

            <div class="mb-6">
                <label class="block text-teal-700 font-bold mb-2">Password</label>
                <input type="password" id="password" placeholder="••••••••" 
                    class="w-full px-4 py-3 bg-teal-50 border-2 border-teal-600 rounded focus:outline-none focus:border-teal-700">
            </div>

            <button onclick="login()" class="w-full bg-teal-600 hover:bg-teal-700 text-white px-6 py-3 rounded font-bold text-lg mb-3">
                Sign Up / Login
            </button>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://pnngnmbfbkbpzhsdpsmj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBubmdubWJmYmticHpoc2Rwc21qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NzU5MDgsImV4cCI6MjA4ODA1MTkwOH0.vIYdJA3eKajAGQ9Om27P8RkqTIeWUlGx1B-npq3u6u0';
        
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        window.login = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('Please fill all fields');
                return;
            }

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    alert('Login failed: ' + error.message);
                    return;
                }
                window.location.href = 'games.html';
            } catch (err) {
                alert('Error: ' + err.message);
            }
        };
    </script>
</body>
</html>
