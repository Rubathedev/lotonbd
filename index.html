<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LottoBD - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%); }
        .glow { box-shadow: 0 0 20px rgba(34, 197, 94, 0.5); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-900 p-8 rounded-lg shadow-2xl w-full max-w-md border border-green-500">
        <h1 class="text-3xl font-bold text-center text-green-400 mb-2">🎰 LottoBD</h1>
        <p class="text-center text-gray-400 mb-8">Bangladesh Lottery System</p>
        
        <div id="loginSection">
            <p class="text-gray-400 text-center mb-6">Enter your details</p>
            
            <div class="mb-4">
                <label class="block text-green-400 mb-2">Email</label>
                <input type="email" id="email" placeholder="your@email.com" 
                    class="w-full px-4 py-3 bg-gray-800 border border-green-500 rounded text-white">
            </div>

            <div class="mb-4">
                <label class="block text-green-400 mb-2">Password (min 6 characters)</label>
                <input type="password" id="password" placeholder="Create a password" 
                    class="w-full px-4 py-3 bg-gray-800 border border-green-500 rounded text-white">
            </div>
            
            <button onclick="handleAuth()" 
                class="w-full bg-green-500 hover:bg-green-600 text-black font-bold py-3 rounded glow mb-3">
                Sign Up / Login
            </button>

            <p class="text-xs text-gray-500 text-center">Instant access - no email confirmation needed!</p>
        </div>

        <div id="successMsg" class="hidden text-center text-green-400 mt-4"></div>
        <div id="loadingMsg" class="hidden text-center text-green-400 mt-4"><p>Loading...</p></div>
        <div id="errorMsg" class="hidden text-center text-red-400 mt-4"></div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://pnngnmbfbkbpzhsdpsmj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBubmdubWJmYmticHpoc2Rwc21qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NzU5MDgsImV4cCI6MjA4ODA1MTkwOH0.vIYdJA3eKajAGQ9Om27P8RkqTIeWUlGx1B-npq3u6u0';
        
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                window.location.href = 'games.html';
            }
        });

        window.handleAuth = async function() {
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showError('Please enter email and password');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }

            showLoading(true);

            try {
                // Try to sign in first
                let { data: signInData, error: signInError } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (signInError && signInError.message.includes('Invalid login')) {
                    // User doesn't exist, sign up
                    const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({
                        email: email,
                        password: password,
                        options: {
                            emailRedirectTo: window.location.origin + '/games.html',
                            data: { email_confirm: false }
                        }
                    });

                    if (signUpError) throw signUpError;

                    if (signUpData.user) {
                        // Create user in database
                        await supabaseClient.from('users').insert({
                            id: signUpData.user.id,
                            email: email,
                            name: email.split('@')[0],
                            balance: 0,
                            total_earned: 0
                        });
                    }

                    showSuccess('Account created! Redirecting...');
                    setTimeout(() => window.location.href = 'games.html', 1500);
                } else if (signInError) {
                    throw signInError;
                } else {
                    // Sign in successful, check if user exists in database
                    const { data: userData, error: userError } = await supabaseClient
                        .from('users')
                        .select('*')
                        .eq('id', signInData.user.id)
                        .single();

                    // If user doesn't exist in database, create them
                    if (userError && userError.code === 'PGRST116') {
                        await supabaseClient.from('users').insert({
                            id: signInData.user.id,
                            email: email,
                            name: email.split('@')[0],
                            balance: 0,
                            total_earned: 0
                        });
                    }

                    showSuccess('Welcome back! Redirecting...');
                    setTimeout(() => window.location.href = 'games.html', 1000);
                }
            } catch (error) {
                console.error('Auth error:', error);
                showError(error.message || 'An error occurred. Please try again.');
                showLoading(false);
            }
        };

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleAuth();
            }
        });

        function showLoading(show) {
            document.getElementById('loadingMsg').classList.toggle('hidden', !show);
            document.getElementById('loginSection').style.opacity = show ? '0.5' : '1';
        }

        function showSuccess(msg) {
            document.getElementById('successMsg').textContent = msg;
            document.getElementById('successMsg').classList.remove('hidden');
            document.getElementById('loadingMsg').classList.add('hidden');
        }

        function showError(msg) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = msg;
            errorDiv.classList.remove('hidden');
            showLoading(false);
            setTimeout(() => errorDiv.classList.add('hidden'), 5000);
        }
    </script>
</body>
</html>
