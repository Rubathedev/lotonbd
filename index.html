<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LottoBD - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4" style="background: linear-gradient(135deg, #E0F2F1 0%, #B2DFDB 100%);">
    <div class="w-full max-w-md">
        <!-- Login Card -->
        <div class="bg-white p-8 rounded-lg border-2 border-teal-600 shadow-lg">
            <!-- Logo -->
            <div class="text-center mb-6">
                <h1 class="text-4xl font-bold text-teal-600 mb-2">🎰 LottoBD</h1>
                <p class="text-gray-600">Bangladesh Lottery System</p>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="hidden">
                <h2 class="text-2xl font-bold text-teal-700 mb-6 text-center">Enter your details</h2>

                <!-- Email Input -->
                <div class="mb-4">
                    <label class="block text-teal-700 font-bold mb-2">Email</label>
                    <input type="email" id="email" placeholder="your@email.com" 
                        class="w-full px-4 py-3 bg-teal-50 border-2 border-teal-600 rounded focus:outline-none focus:border-teal-700">
                </div>

                <!-- Password Input -->
                <div class="mb-6">
                    <label class="block text-teal-700 font-bold mb-2">Password (min 6 characters)</label>
                    <input type="password" id="password" placeholder="••••••••" 
                        class="w-full px-4 py-3 bg-teal-50 border-2 border-teal-600 rounded focus:outline-none focus:border-teal-700">
                </div>

                <!-- Login Button -->
                <button onclick="login()" class="w-full bg-teal-600 hover:bg-teal-700 text-white px-6 py-3 rounded font-bold text-lg mb-3 transition">
                    Sign Up / Login
                </button>

                <!-- Forgot Password Button -->
                <button onclick="showForgotPassword()" class="w-full bg-gray-700 hover:bg-gray-800 text-white px-6 py-2 rounded font-bold transition">
                    🔑 Forgot Password?
                </button>

                <!-- Info Text -->
                <p class="text-center text-gray-600 text-sm mt-4">
                    Instant access - no email confirmation needed!
                </p>
            </div>

            <!-- Forgot Password Form -->
            <div id="forgotPasswordForm" class="hidden">
                <h2 class="text-2xl font-bold text-gray-700 mb-6 text-center">Reset Password</h2>

                <!-- Email Input -->
                <div class="mb-6">
                    <label class="block text-gray-700 font-bold mb-2">Enter your email</label>
                    <input type="email" id="resetEmail" placeholder="your@email.com" 
                        class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-500 rounded focus:outline-none focus:border-gray-700">
                </div>

                <!-- Info Text -->
                <p class="text-gray-600 text-sm mb-6 text-center">
                    We'll send you a link to reset your password
                </p>

                <!-- Send Button -->
                <button onclick="sendResetEmail()" class="w-full bg-teal-600 hover:bg-teal-700 text-white px-6 py-3 rounded font-bold text-lg mb-3 transition">
                    📧 Send Reset Link
                </button>

                <!-- Back Button -->
                <button onclick="showForgotPassword()" class="w-full bg-gray-700 hover:bg-gray-800 text-white px-6 py-2 rounded font-bold transition">
                    ← Back to Login
                </button>
            </div>
        </div>

        <!-- Debug Info -->
        <div class="mt-4 text-center text-gray-600 text-xs">
            <p>🔒 Secure • No email confirmation needed</p>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://pnngnmbfbkbpzhsdpsmj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBubmdubWJmYmticHpoc2Rwc21qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NzU5MDgsImV4cCI6MjA4ODA1MTkwOH0.vIYdJA3eKajAGQ9Om27P8RkqTIeWUlGx1B-npq3u6u0';
        
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        // Show login/forgot password forms
        window.showForgotPassword = function() {
            document.getElementById('loginForm').classList.toggle('hidden');
            document.getElementById('forgotPasswordForm').classList.toggle('hidden');
            document.getElementById('resetEmail').value = document.getElementById('email').value;
        };

        // Check if already logged in
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                window.location.href = 'games.html';
            } else {
                document.getElementById('loginForm').classList.remove('hidden');
            }
        });

        // Login function
        window.login = async function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('Please enter email and password');
                return;
            }

            if (password.length < 6) {
                alert('Password must be at least 6 characters');
                return;
            }

            try {
                // Try to sign in
                const { data: signInData, error: signInError } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (signInError) {
                    // If user doesn't exist, create account
                    if (signInError.message.includes('Invalid login credentials')) {
                        const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({
                            email: email,
                            password: password
                        });

                        if (signUpError) {
                            alert('❌ Error: ' + signUpError.message);
                            return;
                        }

                        // Create user profile
                        const { error: insertError } = await supabaseClient
                            .from('users')
                            .insert({
                                id: signUpData.user.id,
                                email: email,
                                name: email.split('@')[0],
                                balance: 0,
                                total_earned: 0
                            });

                        if (insertError) {
                            console.error('Profile creation error:', insertError);
                        }

                        alert('✅ Account created! Welcome to LottoBD!');
                        window.location.href = 'games.html';
                    } else {
                        alert('❌ Error: ' + signInError.message);
                    }
                } else {
                    alert('✅ Logged in successfully!');
                    window.location.href = 'games.html';
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };

        // Send reset email function
        window.sendResetEmail = async function() {
            const email = document.getElementById('resetEmail').value.trim();

            if (!email) {
                alert('Please enter your email address');
                return;
            }

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: 'https://lotonbd.vercel.app'
                });

                if (error) {
                    alert('❌ Error: ' + error.message);
                } else {
                    alert('✅ Password reset link sent to ' + email + '\n\nCheck your email for the reset link!');
                    document.getElementById('resetEmail').value = '';
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };

        // Allow Enter key to login
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                if (!document.getElementById('loginForm').classList.contains('hidden')) {
                    login();
                }
            }
        });
    </script>
</body>
</html>
