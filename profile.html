<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LottoBD - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%); }
        .glow { box-shadow: 0 0 20px rgba(34, 197, 94, 0.5); }
    </style>
</head>
<body class="min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <div class="bg-gray-900 p-6 rounded-lg border border-green-500 mb-6">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-green-400">👤 My Profile</h1>
                <a href="games.html" class="bg-gray-700 text-white px-4 py-2 rounded">Back to Games</a>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="bg-gray-900 p-6 rounded-lg border border-green-500 glow">
                <h3 class="text-green-400 mb-2">Current Balance</h3>
                <p class="text-4xl font-bold text-white" id="balance">৳0</p>
            </div>
            <div class="bg-gray-900 p-6 rounded-lg border border-green-500 glow">
                <h3 class="text-green-400 mb-2">Total Earned</h3>
                <p class="text-4xl font-bold text-white" id="totalEarned">৳0</p>
            </div>
        </div>

        <div class="bg-gray-900 p-6 rounded-lg border border-green-500 mb-6">
            <h2 class="text-xl font-bold text-green-400 mb-4">My Information</h2>
            <div class="space-y-2">
                <p class="text-gray-400">Name: <span class="text-white" id="userName">-</span></p>
                <p class="text-gray-400">Email: <span class="text-white" id="userEmail">-</span></p>
            </div>
        </div>

        <div class="bg-gray-900 p-6 rounded-lg border border-green-500 mb-6">
            <h2 class="text-xl font-bold text-green-400 mb-4">Actions</h2>
            <a href="withdraw.html" class="block bg-green-500 text-black text-center font-bold py-3 rounded mb-3 hover:bg-green-600">
                💸 Request Withdrawal
            </a>
        </div>

        <div class="bg-gray-900 p-6 rounded-lg border border-green-500">
            <h2 class="text-xl font-bold text-green-400 mb-4">Recent Wins</h2>
            <div id="winHistory" class="space-y-2">
                <p class="text-gray-400">Loading...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://pnngnmbfbkbpzhsdpsmj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBubmdubWJmYmticHpoc2Rwc21qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NzU5MDgsImV4cCI6MjA4ODA1MTkwOH0.vIYdJA3eKajAGQ9Om27P8RkqTIeWUlGx1B-npq3u6u0';
        
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
            if (!session) {
                window.location.href = 'index.html';
                return;
            }

            const { data: userData } = await supabaseClient
                .from('users')
                .select('*')
                .eq('id', session.user.id)
                .single();

            if (userData) {
                document.getElementById('balance').textContent = `৳${userData.balance}`;
                document.getElementById('totalEarned').textContent = `৳${userData.total_earned}`;
                document.getElementById('userName').textContent = userData.name;
                document.getElementById('userEmail').textContent = userData.email;
            }

            const { data: wins } = await supabaseClient
                .from('transactions')
                .select('*')
                .eq('user_id', session.user.id)
                .eq('type', 'prize')
                .order('created_at', { ascending: false })
                .limit(10);

            const winDiv = document.getElementById('winHistory');
            if (!wins || wins.length === 0) {
                winDiv.innerHTML = '<p class="text-gray-400">No wins yet. Keep playing!</p>';
            } else {
                winDiv.innerHTML = '';
                wins.forEach(win => {
                    const date = new Date(win.created_at).toLocaleDateString();
                    winDiv.innerHTML += `
                        <div class="bg-gray-800 p-3 rounded flex justify-between">
                            <span class="text-white">Prize Won - ${date}</span>
                            <span class="text-green-400 font-bold">+৳${win.amount}</span>
                        </div>
                    `;
                });
            }
        });
    </script>
</body>
</html>
