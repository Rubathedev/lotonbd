<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LottoBD - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen p-4" style="background: linear-gradient(135deg, #E0F2F1 0%, #B2DFDB 100%);">
    <div class="max-w-2xl mx-auto">
        <!-- Header with Language Toggle -->
        <div class="bg-white p-6 rounded-lg border-2 border-teal-600 mb-6 shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <a href="games.html" class="text-2xl font-bold text-teal-700 hover:text-teal-800">🎫 LottoBD</a>
                <div class="flex gap-2">
                    <button onclick="setLanguage('en')" id="btnEn" class="bg-blue-600 text-white px-3 py-1 rounded font-bold text-sm">EN</button>
                    <button onclick="setLanguage('bn')" id="btnBn" class="bg-gray-400 text-white px-3 py-1 rounded font-bold text-sm">বাং</button>
                    <a href="games.html" class="bg-teal-600 text-white px-4 py-2 rounded hover:bg-teal-700 font-bold">← Back</a>
                </div>
            </div>
        </div>

        <!-- Profile Picture & Edit Section -->
        <div class="bg-white p-8 rounded-lg border-2 border-teal-600 mb-6 shadow-lg text-center">
            <!-- Profile Picture -->
            <div class="mb-6">
                <div class="relative inline-block">
                    <img id="profilePicture" src="https://via.placeholder.com/150/00897B/FFFFFF?text=User" alt="Profile" 
                        class="w-32 h-32 rounded-full border-4 border-teal-600 object-cover">
                    <label class="absolute bottom-0 right-0 bg-teal-600 text-white p-2 rounded-full cursor-pointer hover:bg-teal-700 transition">
                        📷
                        <input type="file" id="photoInput" accept="image/*" onchange="uploadPhoto()" class="hidden">
                    </label>
                </div>
                <p id="photoHint" class="text-xs text-gray-600 mt-2">Click camera to change photo</p>
            </div>

            <!-- Username Edit -->
            <div class="mb-6">
                <div id="usernameDisplay" class="cursor-pointer">
                    <p id="usernameLabel" class="text-sm text-gray-600 mb-1">Username</p>
                    <p id="usernameValue" class="text-2xl font-bold text-teal-700 hover:text-teal-800 min-h-8">-</p>
                    <p id="editHint" class="text-xs text-gray-600 mt-2 hover:text-teal-600">✏️ Click to edit</p>
                </div>

                <div id="usernameEdit" class="hidden">
                    <input type="text" id="usernameInput" placeholder="Enter new username" 
                        class="w-full px-4 py-2 bg-teal-50 border-2 border-teal-600 rounded text-gray-800 mb-3 focus:outline-none">
                    <div class="flex gap-2">
                        <button onclick="saveUsername()" class="flex-1 bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded font-bold">
                            ✅ Save
                        </button>
                        <button onclick="cancelUsername()" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded font-bold">
                            ✕ Cancel
                        </button>
                    </div>
                </div>
            </div>

            <!-- Email Display -->
            <div class="bg-gray-50 p-4 rounded border-2 border-gray-300">
                <p id="emailLabel" class="text-sm text-gray-600 mb-1">Email</p>
                <p id="emailValue" class="font-bold text-gray-800 min-h-6">-</p>
            </div>
        </div>

        <!-- Balance Section -->
        <div class="bg-white p-6 rounded-lg border-2 border-green-600 mb-6 shadow-lg">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Current Balance -->
                <div class="bg-gradient-to-br from-green-50 to-emerald-50 p-4 rounded-lg border-2 border-green-500">
                    <p id="balanceLabel" class="text-sm text-gray-600 mb-2">Current Balance</p>
                    <p class="text-3xl font-bold text-green-600">৳<span id="currentBalance">0</span></p>
                </div>

                <!-- Total Earned -->
                <div class="bg-gradient-to-br from-amber-50 to-yellow-50 p-4 rounded-lg border-2 border-amber-500">
                    <p id="earnedLabel" class="text-sm text-gray-600 mb-2">Total Earned</p>
                    <p class="text-3xl font-bold text-amber-600">৳<span id="totalEarned">0</span></p>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <a href="withdraw.html" class="bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white px-6 py-4 rounded-lg font-bold text-center border-2 border-red-600 shadow-lg transform hover:scale-105 transition">
                🏧 <span id="withdrawBtn">Withdraw Money</span>
            </a>
            <a href="winners.html" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white px-6 py-4 rounded-lg font-bold text-center border-2 border-pink-600 shadow-lg transform hover:scale-105 transition">
                🏆 <span id="winnersBtn">Winners History</span>
            </a>
        </div>

        <!-- Transaction History -->
        <div class="bg-white p-6 rounded-lg border-2 border-teal-600 shadow-lg">
            <h2 id="historyTitle" class="text-xl font-bold text-teal-700 mb-4">📊 Transaction History</h2>
            <div id="transactionsList" class="space-y-3">
                <p class="text-gray-600 text-center py-8">Loading...</p>
            </div>
        </div>

        <!-- Logout Button -->
        <button onclick="logout()" class="w-full mt-6 bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded font-bold text-lg">
            🚪 <span id="logoutBtn">Logout</span>
        </button>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://pnngnmbfbkbpzhsdpsmj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBubmdubWJmYmticHpoc2Rwc21qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NzU5MDgsImV4cCI6MjA4ODA1MTkwOH0.vIYdJA3eKajAGQ9Om27P8RkqTIeWUlGx1B-npq3u6u0';
        
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let currentLanguage = localStorage.getItem('lottobdLanguage') || 'en';
        let originalUsername = '';

        const translations = {
            en: {
                photoHint: 'Click camera to change photo',
                usernameLabel: 'Username',
                emailLabel: 'Email',
                balanceLabel: 'Current Balance',
                earnedLabel: 'Total Earned',
                withdrawBtn: 'Withdraw Money',
                winnersBtn: 'Winners History',
                historyTitle: '📊 Transaction History',
                logoutBtn: 'Logout',
                editHint: '✏️ Click to edit',
                prize: 'Prize Won',
                topup: 'Balance Added',
                ticket_purchase: 'Ticket Purchase',
                withdrawal: 'Withdrawal Request'
            },
            bn: {
                photoHint: 'ছবি পরিবর্তন করতে ক্যামেরায় ক্লিক করুন',
                usernameLabel: 'ব্যবহারকারী নাম',
                emailLabel: 'ইমেল',
                balanceLabel: 'বর্তমান ব্যালেন্স',
                earnedLabel: 'মোট আয়',
                withdrawBtn: 'টাকা তুলুন',
                winnersBtn: 'বিজয়ীদের ইতিহাস',
                historyTitle: '📊 লেনদেনের ইতিহাস',
                logoutBtn: 'লগ আউট',
                editHint: '✏️ সম্পাদনা করতে ক্লিক করুন',
                prize: 'পুরস্কার জিতেছেন',
                topup: 'ব্যালেন্স যোগ করা হয়েছে',
                ticket_purchase: 'টিকেট ক্রয়',
                withdrawal: 'উত্তোলনের অনুরোধ'
            }
        };

        // Initialize
        supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
            if (!session) {
                window.location.href = 'index.html';
                return;
            }

            currentUser = session.user;
            updateLanguage();
            await loadUserProfile();
            await loadTransactions();
        });

        window.setLanguage = function(lang) {
            currentLanguage = lang;
            localStorage.setItem('lottobdLanguage', lang);
            updateLanguage();
            loadTransactions();
        };

        function updateLanguage() {
            const t = translations[currentLanguage];
            document.getElementById('photoHint').textContent = t.photoHint;
            document.getElementById('usernameLabel').textContent = t.usernameLabel;
            document.getElementById('emailLabel').textContent = t.emailLabel;
            document.getElementById('balanceLabel').textContent = t.balanceLabel;
            document.getElementById('earnedLabel').textContent = t.earnedLabel;
            document.getElementById('withdrawBtn').textContent = t.withdrawBtn;
            document.getElementById('winnersBtn').textContent = t.winnersBtn;
            document.getElementById('historyTitle').textContent = t.historyTitle;
            document.getElementById('logoutBtn').textContent = t.logoutBtn;
            document.getElementById('editHint').textContent = t.editHint;

            document.getElementById('btnEn').classList.toggle('bg-blue-600', currentLanguage === 'en');
            document.getElementById('btnEn').classList.toggle('bg-gray-400', currentLanguage !== 'en');
            document.getElementById('btnBn').classList.toggle('bg-blue-600', currentLanguage === 'bn');
            document.getElementById('btnBn').classList.toggle('bg-gray-400', currentLanguage !== 'bn');
        }

        async function loadUserProfile() {
            try {
                const { data } = await supabaseClient
                    .from('users')
                    .select('name, email, balance, total_earned, photo_url')
                    .eq('id', currentUser.id)
                    .single();

                if (data) {
                    originalUsername = data.name || '';
                    document.getElementById('usernameValue').textContent = data.name || '-';
                    document.getElementById('emailValue').textContent = data.email || currentUser.email || '-';
                    document.getElementById('currentBalance').textContent = data.balance || 0;
                    document.getElementById('totalEarned').textContent = data.total_earned || 0;

                    if (data.photo_url) {
                        document.getElementById('profilePicture').src = data.photo_url;
                    }
                }
            } catch (error) {
                console.error('Load profile error:', error);
                document.getElementById('emailValue').textContent = currentUser.email || '-';
            }
        }

        async function loadTransactions() {
            try {
                const { data } = await supabaseClient
                    .from('transactions')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('created_at', { ascending: false })
                    .limit(20);

                const t = translations[currentLanguage];
                const list = document.getElementById('transactionsList');

                if (!data || data.length === 0) {
                    list.innerHTML = '<p class="text-gray-600 text-center py-8">No transactions</p>';
                    return;
                }

                list.innerHTML = '';
                data.forEach(trans => {
                    const date = new Date(trans.created_at).toLocaleDateString('en-GB', { 
                        day: '2-digit', 
                        month: 'short', 
                        year: 'numeric'
                    });

                    const typeMap = {
                        'prize': t.prize,
                        'topup': t.topup,
                        'ticket_purchase': t.ticket_purchase,
                        'withdrawal': t.withdrawal
                    };

                    const typeLabel = typeMap[trans.type] || trans.type;
                    const amountColor = trans.amount > 0 ? 'text-green-600' : 'text-red-600';
                    const amountSign = trans.amount > 0 ? '+' : '';

                    list.innerHTML += `
                        <div class="bg-gradient-to-r from-teal-50 to-cyan-50 p-4 rounded border-2 border-teal-400 flex justify-between items-center">
                            <div>
                                <p class="font-bold text-gray-800">${typeLabel}</p>
                                <p class="text-sm text-gray-600">${date}</p>
                            </div>
                            <p class="font-bold text-lg ${amountColor}">৳${amountSign}${Math.abs(trans.amount)}</p>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Load transactions error:', error);
            }
        }

        window.uploadPhoto = async function() {
            const input = document.getElementById('photoInput');
            const file = input.files[0];

            if (!file) return;

            if (file.size > 2 * 1024 * 1024) {
                alert('❌ Image must be less than 2MB');
                return;
            }

            try {
                const fileName = `profile_${currentUser.id}_${Date.now()}.jpg`;

                const { error: uploadError } = await supabaseClient.storage
                    .from('profiles')
                    .upload(fileName, file, { upsert: true });

                if (uploadError) throw uploadError;

                const { data } = supabaseClient.storage
                    .from('profiles')
                    .getPublicUrl(fileName);

                const photoUrl = data.publicUrl;

                await supabaseClient
                    .from('users')
                    .update({ photo_url: photoUrl })
                    .eq('id', currentUser.id);

                document.getElementById('profilePicture').src = photoUrl;
                alert('✅ Photo updated!');
            } catch (error) {
                alert('❌ Error uploading photo: ' + error.message);
            }

            input.value = '';
        };

        // Username Edit
        document.getElementById('usernameValue').addEventListener('click', toggleUsernameEdit);
        document.getElementById('editHint').addEventListener('click', toggleUsernameEdit);

        function toggleUsernameEdit() {
            document.getElementById('usernameDisplay').classList.toggle('hidden');
            document.getElementById('usernameEdit').classList.toggle('hidden');
            if (!document.getElementById('usernameEdit').classList.contains('hidden')) {
                document.getElementById('usernameInput').value = originalUsername;
                document.getElementById('usernameInput').focus();
            }
        }

        window.saveUsername = async function() {
            const newUsername = document.getElementById('usernameInput').value.trim();

            if (!newUsername) {
                alert('❌ Username cannot be empty');
                return;
            }

            if (newUsername.length < 2) {
                alert('❌ Username must be at least 2 characters');
                return;
            }

            try {
                const { error } = await supabaseClient
                    .from('users')
                    .update({ name: newUsername })
                    .eq('id', currentUser.id);

                if (error) throw error;

                originalUsername = newUsername;
                document.getElementById('usernameValue').textContent = newUsername;
                document.getElementById('usernameDisplay').classList.remove('hidden');
                document.getElementById('usernameEdit').classList.add('hidden');
                alert('✅ Username updated!');
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };

        window.cancelUsername = function() {
            document.getElementById('usernameDisplay').classList.remove('hidden');
            document.getElementById('usernameEdit').classList.add('hidden');
        };

        window.logout = async function() {
            if (!confirm('Are you sure you want to logout?')) return;

            try {
                await supabaseClient.auth.signOut();
                window.location.href = 'index.html';
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };
    </script>
</body>
</html>
