<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LottoBD - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .btn-press {
            transition: all 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            user-select: none;
        }
        
        .btn-press:hover {
            transform: scale(0.98);
            filter: brightness(1.1);
        }
        
        .btn-press:active {
            transform: scale(0.85) translateY(2px);
        }
    </style>
</head>
<body class="bg-gradient-to-b from-teal-50 to-cyan-50 min-h-screen">
    <div class="max-w-6xl mx-auto px-4">
        <!-- HEADER -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 mt-6 border-2 border-teal-600">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-4xl font-bold text-teal-600">🎫 LottoBD Admin</h1>
                <button onclick="logout()" class="btn-press bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg font-bold border-2 border-red-700">
                    🚪 Logout
                </button>
            </div>
        </div>

        <!-- CREATE GAME SECTION -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border-2 border-green-600">
            <h2 class="text-2xl font-bold text-green-700 mb-6">➕ Create New Game</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                <!-- Game Type Selection -->
                <div>
                    <label class="block font-bold text-gray-700 mb-3">Select Game Type:</label>
                    <select id="gameType" class="w-full p-3 border-2 border-teal-600 rounded-lg font-bold text-lg">
                        <option value="junior">🎮 Junior (৳200)</option>
                        <option value="vip">💎 VIP (৳1,000)</option>
                    </select>
                </div>

                <!-- Game Number -->
                <div>
                    <label class="block font-bold text-gray-700 mb-3">Game Number:</label>
                    <input type="number" id="gameNumber" placeholder="e.g. 1" min="1" max="999" class="w-full p-3 border-2 border-teal-600 rounded-lg font-bold text-lg">
                </div>

                <!-- Create Button -->
                <div class="flex items-end">
                    <button onclick="createSingleGame()" class="btn-press w-full bg-green-600 hover:bg-green-700 text-white p-3 rounded-lg font-bold border-2 border-green-700 text-lg">
                        ✅ Create Game
                    </button>
                </div>
            </div>
        </div>

        <!-- ACTIVE GAMES SECTION -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border-2 border-blue-600">
            <h2 class="text-2xl font-bold text-blue-700 mb-6">🎮 Active Games</h2>
            
            <div class="space-y-4">
                <!-- Junior Games -->
                <div>
                    <h3 class="text-xl font-bold text-teal-700 mb-3">Junior Games (৳200)</h3>
                    <div id="juniorGamesList" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-5 gap-3">
                        <p class="col-span-full text-center text-gray-600">Loading...</p>
                    </div>
                </div>

                <!-- VIP Games -->
                <div class="mt-6">
                    <h3 class="text-xl font-bold text-amber-700 mb-3">VIP Games (৳1,000)</h3>
                    <div id="vipGamesList" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-5 gap-3">
                        <p class="col-span-full text-center text-gray-600">Loading...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- COMPLETED GAMES SECTION -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border-2 border-purple-600">
            <h2 class="text-2xl font-bold text-purple-700 mb-6">✅ Completed Games</h2>
            
            <div id="completedGamesList" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
                <p class="col-span-full text-center text-gray-600">Loading...</p>
            </div>
        </div>

        <!-- ADD MONEY SECTION -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border-2 border-orange-600">
            <h2 class="text-2xl font-bold text-orange-700 mb-6">💰 Add Money to User</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                <input type="email" id="userEmail" placeholder="User Email" class="p-3 border-2 border-orange-600 rounded-lg font-bold">
                <input type="number" id="addAmount" placeholder="Amount" min="0" class="p-3 border-2 border-orange-600 rounded-lg font-bold">
                <button onclick="addMoneyToUser()" class="btn-press bg-orange-600 hover:bg-orange-700 text-white p-3 rounded-lg font-bold border-2 border-orange-700 col-span-1 sm:col-span-1">
                    ✅ Add Money
                </button>
            </div>
        </div>

        <!-- WITHDRAWALS SECTION -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border-2 border-red-600">
            <h2 class="text-2xl font-bold text-red-700 mb-6">📋 Pending Withdrawals</h2>
            
            <div id="withdrawalsList" class="space-y-3">
                <p class="text-center text-gray-600">Loading...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://pnngnmbfbkbpzhsdpsmj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBubmdubWJmYmticHpoc2Rwc21qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NzU5MDgsImV4cCI6MjA4ODA1MTkwOH0.vIYdJA3eKajAGQ9Om27P8RkqTIeWUlGx1B-npq3u6u0';
        
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
        const ADMIN_UID = 'cee05a83-4119-408f-af5f-21fa86caf8a9';

        let currentUser = null;

        // Initialize
        supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
            if (!session || session.user.id !== ADMIN_UID) {
                alert('❌ Admin access only!');
                window.location.href = 'index.html';
                return;
            }
            currentUser = session.user;
            loadGames();
            loadWithdrawals();
        });

        window.createSingleGame = async function() {
            const gameType = document.getElementById('gameType').value;
            const gameNumber = parseInt(document.getElementById('gameNumber').value);

            if (!gameNumber || gameNumber < 1) {
                alert('❌ Please enter a valid game number!');
                return;
            }

            try {
                // Check if game already exists
                const { data: existingGame } = await supabaseClient
                    .from('games')
                    .select('id')
                    .eq('game_number', gameNumber)
                    .eq('game_type', gameType)
                    .single();

                if (existingGame) {
                    alert('❌ Game #' + gameNumber + ' already exists!');
                    return;
                }

                // Create single game
                const { data, error } = await supabaseClient
                    .from('games')
                    .insert({
                        game_number: gameNumber,
                        game_type: gameType,
                        status: 'active',
                        tickets_sold: 0,
                        date: new Date().toISOString()
                    });

                if (error) {
                    alert('❌ Error: ' + error.message);
                    return;
                }

                alert('✅ Game #' + gameNumber + ' created successfully!');
                document.getElementById('gameNumber').value = '';
                loadGames();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };

        async function loadGames() {
            try {
                const { data } = await supabaseClient
                    .from('games')
                    .select('*')
                    .order('game_type')
                    .order('game_number');

                const juniorList = document.getElementById('juniorGamesList');
                const vipList = document.getElementById('vipGamesList');
                const completedList = document.getElementById('completedGamesList');

                const juniorActive = data.filter(g => g.game_type === 'junior' && g.status === 'active') || [];
                const vipActive = data.filter(g => g.game_type === 'vip' && g.status === 'active') || [];
                const completed = data.filter(g => g.status === 'completed') || [];

                juniorList.innerHTML = juniorActive.length ? juniorActive.map(createGameCard).join('') : '<p class="col-span-full text-center">No active junior games</p>';
                vipList.innerHTML = vipActive.length ? vipActive.map(createGameCard).join('') : '<p class="col-span-full text-center">No active VIP games</p>';
                completedList.innerHTML = completed.length ? completed.map(createCompletedCard).join('') : '<p class="col-span-full text-center">No completed games</p>';
            } catch (error) {
                console.error('Load games error:', error);
            }
        }

        function createGameCard(game) {
            const gameNum = String(game.game_number).padStart(2, '0');
            const sold = game.tickets_sold || 0;
            const percentFull = (sold / 10) * 100;

            return `
                <div class="bg-gradient-to-br from-teal-100 to-cyan-100 p-4 rounded-lg border-2 border-teal-600 shadow-lg">
                    <p class="text-teal-700 font-bold text-lg mb-2">#${gameNum}</p>
                    <p class="text-sm text-gray-600 mb-2">${sold}/10</p>
                    <div class="w-full bg-gray-300 rounded-full h-2 mb-2">
                        <div class="bg-teal-600 h-2 rounded-full" style="width: ${percentFull}%"></div>
                    </div>
                    <button onclick="deleteGame('${game.id}')" class="btn-press w-full bg-red-500 hover:bg-red-600 text-white text-xs py-1 rounded font-bold">
                        🗑️ Delete
                    </button>
                </div>
            `;
        }

        function createCompletedCard(game) {
            const gameNum = String(game.game_number).padStart(2, '0');
            const gameType = game.game_type === 'vip' ? '💎 VIP' : '🎮 Junior';

            return `
                <div class="bg-gradient-to-br from-green-100 to-emerald-100 p-4 rounded-lg border-2 border-green-600 shadow-lg">
                    <p class="text-green-700 font-bold text-lg mb-2">#${gameNum}</p>
                    <p class="text-sm text-gray-600 mb-2">${gameType}</p>
                    <p class="text-xs font-bold text-green-700">✅ Completed</p>
                </div>
            `;
        }

        window.deleteGame = async function(gameId) {
            if (!confirm('❌ Are you sure? This will delete the game!')) return;

            try {
                // Delete tickets first (cascade)
                await supabaseClient.from('tickets').delete().eq('game_id', gameId);
                
                // Delete game
                const { error } = await supabaseClient
                    .from('games')
                    .delete()
                    .eq('id', gameId);

                if (error) {
                    alert('❌ Error: ' + error.message);
                    return;
                }

                alert('✅ Game deleted!');
                loadGames();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };

        window.addMoneyToUser = async function() {
            const email = document.getElementById('userEmail').value;
            const amount = parseInt(document.getElementById('addAmount').value);

            if (!email || !amount || amount <= 0) {
                alert('❌ Enter valid email and amount!');
                return;
            }

            try {
                const { data: user } = await supabaseClient
                    .from('users')
                    .select('id, balance')
                    .eq('email', email)
                    .single();

                if (!user) {
                    alert('❌ User not found!');
                    return;
                }

                await supabaseClient
                    .from('users')
                    .update({ balance: (user.balance || 0) + amount })
                    .eq('id', user.id);

                await supabaseClient.from('transactions').insert({
                    user_id: user.id,
                    type: 'topup',
                    amount: amount
                });

                alert('✅ Added ৳' + amount + ' to ' + email);
                document.getElementById('userEmail').value = '';
                document.getElementById('addAmount').value = '';
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };

        async function loadWithdrawals() {
            try {
                const { data } = await supabaseClient
                    .from('withdrawals')
                    .select('*, users(name, email)')
                    .eq('status', 'pending')
                    .order('created_at', { ascending: false });

                const list = document.getElementById('withdrawalsList');
                list.innerHTML = data.length ? data.map(createWithdrawalCard).join('') : '<p class="text-center text-gray-600">No pending withdrawals</p>';
            } catch (error) {
                console.error('Load withdrawals error:', error);
            }
        }

        function createWithdrawalCard(withdrawal) {
            return `
                <div class="bg-yellow-50 p-4 rounded-lg border-2 border-yellow-400">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <p class="font-bold text-lg">${withdrawal.users.name}</p>
                            <p class="text-sm text-gray-600">${withdrawal.users.email}</p>
                        </div>
                        <p class="text-2xl font-bold text-yellow-700">৳${withdrawal.amount}</p>
                    </div>
                    <div class="flex justify-between items-center mb-3">
                        <p class="text-sm"><strong>Method:</strong> ${withdrawal.method}</p>
                        <p class="text-sm"><strong>Account:</strong> ${withdrawal.account}</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="approveWithdrawal('${withdrawal.id}')" class="btn-press flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded font-bold text-sm">
                            ✅ Approve
                        </button>
                        <button onclick="rejectWithdrawal('${withdrawal.id}')" class="btn-press flex-1 bg-red-600 hover:bg-red-700 text-white py-2 rounded font-bold text-sm">
                            ❌ Reject
                        </button>
                    </div>
                </div>
            `;
        }

        window.approveWithdrawal = async function(withdrawalId) {
            if (!confirm('✅ Approve this withdrawal?')) return;

            try {
                await supabaseClient
                    .from('withdrawals')
                    .update({ status: 'completed' })
                    .eq('id', withdrawalId);

                alert('✅ Withdrawal approved!');
                loadWithdrawals();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };

        window.rejectWithdrawal = async function(withdrawalId) {
            if (!confirm('❌ Reject this withdrawal?')) return;

            try {
                await supabaseClient
                    .from('withdrawals')
                    .update({ status: 'rejected' })
                    .eq('id', withdrawalId);

                alert('✅ Withdrawal rejected!');
                loadWithdrawals();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };

        window.logout = async function() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        };
    </script>
</body>
</html>
