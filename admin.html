        async function loadGames() {
            try {
                const { data } = await supabaseClient
                    .from('games')
                    .select('*')
                    .eq('status', 'active')
                    .order('game_type', { ascending: true })
                    .order('game_number', { ascending: true });

                    return;
                }

                    const gameNum = String(game.game_number).padStart(2, '0');
                    const isJunior = game.game_type === 'junior';

                    const barColor = isJunior ? 'bg-teal-600' : 'bg-amber-500';
                    const type = isJunior ? 'Junior' : '💎 VIP';
                    const price = isJunior ? '৳200' : '৳1,000';

                    gamesList.innerHTML += `

let allCustomers = [];

// Load all customers on page load
supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
    if (!session) {
        window.location.href = 'index.html';
        return;
    }

    if (session.user.id !== ADMIN_USER_ID) {
        document.getElementById('accessDenied').classList.remove('hidden');
        return;
    }

    document.getElementById('adminContent').classList.remove('hidden');
    await loadAllCustomers();  // ADD THIS LINE
    await loadGames();
});

// Load all customers
async function loadAllCustomers() {
    try {
        const { data } = await supabaseClient
            .from('users')
            .select('id, name, email, balance')
            .order('created_at', { ascending: false });

        allCustomers = data || [];
        displayAllCustomers(allCustomers);
    } catch (error) {
        console.error('Load customers error:', error);
    }
}

// Display all customers in list
function displayAllCustomers(customers) {
    const list = document.getElementById('customersList');
    document.getElementById('totalUsers').textContent = customers.length;

    if (customers.length === 0) {
        list.innerHTML = '<p class="text-gray-600 text-center py-4">No customers yet</p>';
        return;
    }

    list.innerHTML = '';
    customers.forEach(customer => {
        list.innerHTML += `
            <div onclick="selectCustomer('${customer.id}', '${customer.name}', '${customer.email}')" 
                class="bg-white p-3 rounded border border-green-400 cursor-pointer hover:bg-green-100 transition">
                <p class="text-gray-800 font-bold">${customer.name}</p>
                <p class="text-sm text-gray-600">${customer.email}</p>
                <p class="text-xs text-green-700">Balance: ৳${customer.balance}</p>
            </div>
        `;
    });
}

// Search customers by email (autocomplete)
window.searchCustomers = function() {
    const searchTerm = document.getElementById('customerSearch').value.toLowerCase();
    const suggestionsDiv = document.getElementById('suggestions');

    if (searchTerm.length < 2) {
        suggestionsDiv.classList.add('hidden');
        displayAllCustomers(allCustomers);
        return;
    }

    const matches = allCustomers.filter(c => 
        c.email.toLowerCase().includes(searchTerm) || 
        c.name.toLowerCase().includes(searchTerm)
    );

    if (matches.length === 0) {
        suggestionsDiv.classList.add('hidden');
        displayAllCustomers(allCustomers);
        return;
    }

    suggestionsDiv.innerHTML = '';
    matches.slice(0, 8).forEach(customer => {
        suggestionsDiv.innerHTML += `
            <div onclick="selectCustomer('${customer.id}', '${customer.name}', '${customer.email}')"
                class="p-3 border-b border-green-200 cursor-pointer hover:bg-green-50">
                <p class="text-gray-800 font-bold">${customer.name}</p>
                <p class="text-sm text-gray-600">${customer.email}</p>
            </div>
        `;
    });

    suggestionsDiv.classList.remove('hidden');
    displayAllCustomers(matches);
};

// Select customer from suggestions or list
window.selectCustomer = function(id, name, email) {
    selectedCustomerId = id;
    document.getElementById('customerSearch').value = email;
    document.getElementById('selectedName').value = name;
    document.getElementById('suggestions').classList.add('hidden');
    document.getElementById('amountSection').classList.remove('hidden');
    document.getElementById('addAmount').focus();
};

// Clear customer selection
window.clearCustomerSelection = function() {
    selectedCustomerId = null;
    document.getElementById('customerSearch').value = '';
    document.getElementById('selectedName').value = '';
    document.getElementById('addAmount').value = '';
    document.getElementById('amountSection').classList.add('hidden');
    document.getElementById('suggestions').classList.add('hidden');
};

// Add money to selected customer
window.addMoneyToCustomer = async function() {
    if (!selectedCustomerId) {
        alert('Please select a customer first');
        return;
    }

    const amount = parseInt(document.getElementById('addAmount').value);
    if (!amount || amount <= 0) {
        alert('Please enter valid amount');
        return;
    }

    try {
        // Get current balance
        const { data: user } = await supabaseClient
            .from('users')
            .select('balance, name')
            .eq('id', selectedCustomerId)
            .single();

        if (!user) {
            alert('Customer not found');
            return;
        }

        // Update balance
        const newBalance = user.balance + amount;
        const { error } = await supabaseClient
            .from('users')
            .update({ balance: newBalance })
            .eq('id', selectedCustomerId);

        if (error) throw error;

        // Record transaction
        await supabaseClient.from('transactions').insert({
            user_id: selectedCustomerId,
            type: 'topup',
            amount: amount
        });

        alert(`✅ Added ৳${amount} to ${user.name}\nNew balance: ৳${newBalance}`);
        
        // Refresh and clear
        await loadAllCustomers();
        clearCustomerSelection();

    } catch (error) {
        alert('Error: ' + error.message);
    }
};
