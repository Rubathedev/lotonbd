<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LottoBD - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #E0F2F1 0%, #B2DFDB 100%); }
    </style>
</head>
<body class="min-h-screen p-4">
    <div id="accessDenied" class="hidden min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg border-2 border-red-500 text-center shadow-lg">
            <h1 class="text-3xl font-bold text-red-600 mb-4">🚫 ACCESS DENIED</h1>
            <p class="text-gray-700 mb-6">Not authorized</p>
            <a href="games.html" class="bg-teal-600 text-white px-6 py-3 rounded hover:bg-teal-700">Back</a>
        </div>
    </div>

    <div id="adminContent" class="hidden">
        <div class="max-w-6xl mx-auto">
            <!-- Header -->
            <div class="bg-white p-6 rounded-lg border-2 border-teal-600 mb-6 shadow-lg">
                <div class="flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-teal-700">🔧 Admin Control</h1>
                    <a href="games.html" class="bg-teal-600 text-white px-4 py-2 rounded hover:bg-teal-700">Back</a>
                </div>
            </div>

            <!-- Create Games Buttons -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <button onclick="createJuniorGames()" class="bg-teal-600 hover:bg-teal-700 text-white p-6 rounded-lg border-2 border-teal-700 shadow-lg text-center font-bold text-lg transform hover:scale-105 transition">
                    ✨ Create 10 Junior Games<br><span class="text-sm">৳200 each • 10 slots</span>
                </button>
                
                <button onclick="createVIPGame()" class="bg-amber-500 hover:bg-amber-600 text-white p-6 rounded-lg border-2 border-amber-600 shadow-lg text-center font-bold text-lg transform hover:scale-105 transition">
                    💎 Create 1 VIP Game<br><span class="text-sm">৳1,000 each • 10 slots</span>
                </button>
            </div>

            <!-- Games List -->
            <div class="bg-white p-6 rounded-lg border-2 border-teal-600 shadow-lg">
                <h2 class="text-xl font-bold text-teal-700 mb-4">📊 Active Games</h2>
                
                <div id="gamesList" class="space-y-2">
                    <p class="text-gray-600 text-center py-8">Loading games...</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://pnngnmbfbkbpzhsdpsmj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBubmdubWJmYmticHpoc2Rwc21qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NzU5MDgsImV4cCI6MjA4ODA1MTkwOH0.vIYdJA3eKajAGQ9Om27P8RkqTIeWUlGx1B-npq3u6u0';
        
        const ADMIN_USER_ID = 'cee05a83-4119-408f-af5f-21fa86caf8a9';
        
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
            if (!session) {
                window.location.href = 'index.html';
                return;
            }

            if (session.user.id !== ADMIN_USER_ID) {
                document.getElementById('accessDenied').classList.remove('hidden');
                return;
            }

            document.getElementById('adminContent').classList.remove('hidden');
            
            await autoCleanupOldGames();
            await loadGames();
        });

        // AUTO-CLEANUP: Delete games that are completed and older than 24 hours
        async function autoCleanupOldGames() {
            try {
                const now = new Date();
                const oneDayAgo = new Date(now.getTime() - 24 * 60 * 60 * 1000);
                const oneDayAgoISO = oneDayAgo.toISOString();

                // Get all completed games older than 24 hours
                const { data: oldGames } = await supabaseClient
                    .from('games')
                    .select('id')
                    .eq('status', 'completed')
                    .lt('updated_at', oneDayAgoISO);

                if (oldGames && oldGames.length > 0) {
                    const gameIds = oldGames.map(g => g.id);

                    // Delete tickets from old games
                    await supabaseClient
                        .from('tickets')
                        .delete()
                        .in('game_id', gameIds);

                    // Delete old games
                    await supabaseClient
                        .from('games')
                        .delete()
                        .in('id', gameIds);

                    console.log(`🧹 Auto-cleaned ${oldGames.length} old games`);
                }
            } catch (error) {
                console.error('Auto-cleanup error:', error);
            }
        }

        // Load and display all active games
        async function loadGames() {
            try {
                const { data } = await supabaseClient
                    .from('games')
                    .select('*')
                    .eq('status', 'active')
                    .order('game_type', { ascending: true })
                    .order('game_number', { ascending: true });

                const gamesList = document.getElementById('gamesList');

                if (!data || data.length === 0) {
                    gamesList.innerHTML = '<p class="text-gray-600 text-center py-8">No active games. Create some!</p>';
                    return;
                }

                gamesList.innerHTML = '';

                data.forEach(game => {
                    const gameNum = String(game.game_number).padStart(2, '0');
                    const isJunior = game.game_type === 'junior';
                    const maxTickets = 10;
                    const sold = game.tickets_sold || 0;
                    const percentFull = (sold / maxTickets) * 100;
                    
                    const bgColor = isJunior ? 'bg-teal-50' : 'bg-amber-50';
                    const borderColor = isJunior ? 'border-teal-500' : 'border-amber-500';
                    const textColor = isJunior ? 'text-teal-700' : 'text-amber-700';
                    const barColor = isJunior ? 'bg-teal-600' : 'bg-amber-500';
                    const buttonColor = isJunior ? 'bg-red-500 hover:bg-red-600' : 'bg-red-500 hover:bg-red-600';
                    const type = isJunior ? 'Junior' : '💎 VIP';
                    const price = isJunior ? '৳200' : '৳1,000';

                    gamesList.innerHTML += `
                        <div class="${bgColor} p-4 rounded-lg border-2 ${borderColor} flex justify-between items-center">
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-2">
                                    <h3 class="${textColor} font-bold text-lg">${type} #${gameNum}</h3>
                                    <span class="text-xs text-gray-600">${sold}/${maxTickets}</span>
                                </div>
                                <div class="w-32 bg-gray-200 rounded-full h-2">
                                    <div class="${barColor} h-2 rounded-full" style="width: ${percentFull}%"></div>
                                </div>
                            </div>
                            <div class="text-right ml-4">
                                <p class="text-gray-600 font-bold">${price}</p>
                                ${sold >= maxTickets ? '<p class="text-red-500 text-sm font-bold">FULL</p>' : '<p class="text-green-600 text-sm">Active</p>'}
                            </div>
                            <button onclick="deleteGame('${game.id}')" class="${buttonColor} text-white px-4 py-2 rounded font-bold ml-3 text-sm">
                                🗑️ Delete
                            </button>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Load games error:', error);
            }
        }

        window.createJuniorGames = async function() {
            if (!confirm('Create 10 junior games?')) return;

            try {
                const today = new Date().toISOString().split('T')[0];
                
                const { data: existing } = await supabaseClient
                    .from('games')
                    .select('game_number')
                    .eq('date', today)
                    .eq('game_type', 'junior')
                    .order('game_number', { ascending: false })
                    .limit(1);
                
                const startNum = existing && existing.length > 0 ? existing[0].game_number + 1 : 1;
                
                const games = [];
                for (let i = 0; i < 10; i++) {
                    games.push({
                        date: today,
                        game_number: startNum + i,
                        game_type: 'junior',
                        status: 'active',
                        tickets_sold: 0
                    });
                }

                const { error } = await supabaseClient.from('games').insert(games);
                
                if (error) {
                    alert('Error: ' + error.message);
                } else {
                    alert('✅ 10 Junior games created!');
                    await loadGames();
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        };

        window.createVIPGame = async function() {
            if (!confirm('Create 1 VIP game?')) return;

            try {
                const today = new Date().toISOString().split('T')[0];
                
                const { data: existing } = await supabaseClient
                    .from('games')
                    .select('game_number')
                    .eq('date', today)
                    .eq('game_type', 'vip')
                    .order('game_number', { ascending: false })
                    .limit(1);
                
                const gameNum = existing && existing.length > 0 ? existing[0].game_number + 1 : 1;

                const { error } = await supabaseClient.from('games').insert({
                    date: today,
                    game_number: gameNum,
                    game_type: 'vip',
                    status: 'active',
                    tickets_sold: 0
                });
                
                if (error) {
                    alert('Error: ' + error.message);
                } else {
                    alert('✅ VIP game created!');
                    await loadGames();
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        };

        window.deleteGame = async function(gameId) {
            if (!confirm('Delete this game? Cannot be undone!')) return;

            try {
                // Delete all tickets from this game
                await supabaseClient
                    .from('tickets')
                    .delete()
                    .eq('game_id', gameId);

                // Delete the game
                const { error } = await supabaseClient
                    .from('games')
                    .delete()
                    .eq('id', gameId);

                if (error) {
                    alert('Error: ' + error.message);
                } else {
                    alert('✅ Game deleted!');
                    await loadGames();
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        };

        // Refresh games every 5 seconds
        setInterval(() => {
            loadGames();
        }, 5000);
    </script>
</body>
</html>
