<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LottoBD - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .btn-press {
            transition: all 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            user-select: none;
        }
        
        .btn-press:hover {
            transform: scale(0.98);
            filter: brightness(1.1);
        }
        
        .btn-press:active {
            transform: scale(0.85) translateY(2px);
        }
    </style>
</head>
<body class="bg-gradient-to-b from-teal-50 to-cyan-50 min-h-screen">
    <div class="max-w-6xl mx-auto px-4">
        <!-- HEADER -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 mt-6 border-2 border-teal-600">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-4xl font-bold text-teal-600">🎫 LottoBD Admin</h1>
                <div class="flex gap-2">
                    <a href="games.html" class="btn-press bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-bold border-2 border-blue-700">
                        ← Back to Games
                    </a>
                    <button onclick="logout()" class="btn-press bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg font-bold border-2 border-red-700">
                        🚪 Logout
                    </button>
                </div>
            </div>
        </div>

        <!-- CREATE GAME SECTION -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border-2 border-green-600">
            <h2 class="text-2xl font-bold text-green-700 mb-6">➕ Create New Game</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                <!-- Game Type Selection -->
                <div>
                    <label class="block font-bold text-gray-700 mb-3">Select Game Type:</label>
                    <select id="gameType" class="w-full p-3 border-2 border-teal-600 rounded-lg font-bold text-lg">
                        <option value="junior">🎮 Junior (৳200)</option>
                        <option value="vip">💎 VIP (৳1,000)</option>
                    </select>
                </div>

                <!-- Game Number -->
                <div>
                    <label class="block font-bold text-gray-700 mb-3">Game Number:</label>
                    <input type="number" id="gameNumber" placeholder="e.g. 1" min="1" max="999" class="w-full p-3 border-2 border-teal-600 rounded-lg font-bold text-lg">
                </div>

                <!-- Create Button -->
                <div class="flex items-end">
                    <button onclick="createSingleGame()" class="btn-press w-full bg-green-600 hover:bg-green-700 text-white p-3 rounded-lg font-bold border-2 border-green-700 text-lg">
                        ✅ Create Game
                    </button>
                </div>
            </div>
        </div>

        <!-- USER SEARCH & ADD MONEY SECTION -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border-2 border-orange-600">
            <h2 class="text-2xl font-bold text-orange-700 mb-6">💰 Add Money to User</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                <!-- Search User Email -->
                <div class="relative sm:col-span-2">
                    <input type="email" id="userEmail" placeholder="Search user email..." class="w-full p-3 border-2 border-orange-600 rounded-lg font-bold" oninput="searchUsers()">
                    <div id="emailSuggestions" class="hidden absolute top-full left-0 right-0 bg-white border-2 border-orange-600 rounded-lg mt-1 z-10 max-h-40 overflow-y-auto">
                    </div>
                </div>

                <!-- Amount -->
                <input type="number" id="addAmount" placeholder="Amount" min="0" class="p-3 border-2 border-orange-600 rounded-lg font-bold text-lg">

                <!-- Add Button -->
                <button onclick="addMoneyToUser()" class="btn-press bg-orange-600 hover:bg-orange-700 text-white p-3 rounded-lg font-bold border-2 border-orange-700">
                    ✅ Add Money
                </button>
            </div>
        </div>

        <!-- ALL USERS SECTION -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border-2 border-indigo-600">
            <h2 class="text-2xl font-bold text-indigo-700 mb-6">👥 All Users/Players</h2>
            
            <div id="usersList" class="space-y-2">
                <p class="text-center text-gray-600">Loading...</p>
            </div>
        </div>

        <!-- ACTIVE GAMES SECTION - LIST VIEW -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border-2 border-blue-600">
            <h2 class="text-2xl font-bold text-blue-700 mb-6">🎮 Active Games</h2>
            
            <div id="activeGamesList" class="space-y-2">
                <p class="text-center text-gray-600">Loading...</p>
            </div>
        </div>

        <!-- COMPLETED GAMES SECTION - LIST VIEW -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border-2 border-purple-600">
            <h2 class="text-2xl font-bold text-purple-700 mb-6">✅ Completed Games</h2>
            
            <div id="completedGamesList" class="space-y-2">
                <p class="text-center text-gray-600">Loading...</p>
            </div>
        </div>

        <!-- WITHDRAWALS SECTION -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border-2 border-red-600">
            <h2 class="text-2xl font-bold text-red-700 mb-6">📋 Pending Withdrawals</h2>
            
            <div id="withdrawalsList" class="space-y-3">
                <p class="text-center text-gray-600">Loading...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://pnngnmbfbkbpzhsdpsmj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBubmdubWJmYmticHpoc2Rwc21qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NzU5MDgsImV4cCI6MjA4ODA1MTkwOH0.vIYdJA3eKajAGQ9Om27P8RkqTIeWUlGx1B-npq3u6u0';
        
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
        const ADMIN_UID = 'cee05a83-4119-408f-af5f-21fa86caf8a9';

        let currentUser = null;
        let allUsers = [];

        // Initialize
        supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
            if (!session || session.user.id !== ADMIN_UID) {
                alert('❌ Admin access only!');
                window.location.href = 'index.html';
                return;
            }
            currentUser = session.user;
            await loadAllUsers();
            loadGames();
            loadWithdrawals();
        });

        async function loadAllUsers() {
            try {
                const { data } = await supabaseClient.from('users').select('id, email, name, balance').order('created_at', { ascending: false });
                allUsers = data || [];
                displayUsers();
            } catch (error) {
                console.error('Load users error:', error);
            }
        }

        function displayUsers() {
            const list = document.getElementById('usersList');
            
            if (allUsers.length === 0) {
                list.innerHTML = '<p class="text-center text-gray-600">No users yet</p>';
                return;
            }

            list.innerHTML = allUsers.map(user => `
                <div class="bg-indigo-50 p-4 rounded-lg border-2 border-indigo-400 flex justify-between items-center">
                    <div>
                        <p class="font-bold text-lg">${user.name || 'No Name'}</p>
                        <p class="text-sm text-gray-600">${user.email}</p>
                    </div>
                    <p class="text-2xl font-bold text-indigo-700">৳${user.balance || 0}</p>
                </div>
            `).join('');
        }

        window.searchUsers = function() {
            const input = document.getElementById('userEmail').value.toLowerCase();
            const suggestions = document.getElementById('emailSuggestions');
            
            if (input.length < 2) {
                suggestions.classList.add('hidden');
                return;
            }

            const matches = allUsers.filter(u => u.email.toLowerCase().includes(input)).slice(0, 5);
            
            if (matches.length === 0) {
                suggestions.classList.add('hidden');
                return;
            }

            suggestions.innerHTML = matches.map(user => `
                <div onclick="selectUser('${user.email}')" class="p-3 border-b cursor-pointer hover:bg-orange-50 font-bold">
                    ${user.email}
                    <span class="text-gray-600 text-sm"> (৳${user.balance || 0})</span>
                </div>
            `).join('');

            suggestions.classList.remove('hidden');
        };

        window.selectUser = function(email) {
            document.getElementById('userEmail').value = email;
            document.getElementById('emailSuggestions').classList.add('hidden');
            document.getElementById('addAmount').focus();
        };

        window.createSingleGame = async function() {
            const gameType = document.getElementById('gameType').value;
            const gameNumber = parseInt(document.getElementById('gameNumber').value);

            if (!gameNumber || gameNumber < 1) {
                alert('❌ Please enter a valid game number!');
                return;
            }

            try {
                // Check if game already exists
                const { data: existingGame } = await supabaseClient
                    .from('games')
                    .select('id')
                    .eq('game_number', gameNumber)
                    .eq('game_type', gameType)
                    .single();

                if (existingGame) {
                    alert('❌ Game #' + gameNumber + ' already exists!');
                    return;
                }

                // Create single game
                const { data, error } = await supabaseClient
                    .from('games')
                    .insert({
                        game_number: gameNumber,
                        game_type: gameType,
                        status: 'active',
                        tickets_sold: 0,
                        date: new Date().toISOString()
                    });

                if (error) {
                    alert('❌ Error: ' + error.message);
                    return;
                }

                alert('✅ Game #' + gameNumber + ' created successfully!');
                document.getElementById('gameNumber').value = '';
                loadGames();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };

        async function loadGames() {
            try {
                const { data } = await supabaseClient
                    .from('games')
                    .select('*')
                    .order('game_type')
                    .order('game_number');

                const activeList = document.getElementById('activeGamesList');
                const completedList = document.getElementById('completedGamesList');

                const active = data.filter(g => g.status === 'active') || [];
                const completed = data.filter(g => g.status === 'completed') || [];

                activeList.innerHTML = active.length ? active.map(createActiveGameItem).join('') : '<p class="text-center text-gray-600">No active games</p>';
                completedList.innerHTML = completed.length ? completed.map(createCompletedListItem).join('') : '<p class="text-center text-gray-600">No completed games</p>';
            } catch (error) {
                console.error('Load games error:', error);
            }
        }

        function createActiveGameItem(game) {
            const gameNum = String(game.game_number).padStart(2, '0');
            const gameType = game.game_type === 'vip' ? '💎 VIP (৳1,000)' : '🎮 Junior (৳200)';
            const sold = game.tickets_sold || 0;
            const percentFull = (sold / 10) * 100;

            return `
                <div class="bg-blue-50 p-4 rounded-lg border-2 border-blue-400">
                    <div class="flex justify-between items-center mb-3">
                        <div>
                            <p class="font-bold text-lg">#${gameNum} - ${gameType}</p>
                            <p class="text-sm text-gray-600">${sold}/10 players</p>
                        </div>
                        <button onclick="deleteGame('${game.id}')" class="btn-press bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded font-bold text-sm">
                            🗑️ Delete
                        </button>
                    </div>
                    <div class="w-full bg-gray-300 rounded-full h-3">
                        <div class="bg-blue-600 h-3 rounded-full" style="width: ${percentFull}%"></div>
                    </div>
                </div>
            `;
        }

        function createCompletedListItem(game) {
            const gameNum = String(game.game_number).padStart(2, '0');
            const gameType = game.game_type === 'vip' ? '💎 VIP' : '🎮 Junior';

            return `
                <div class="bg-green-50 p-4 rounded-lg border-2 border-green-400 flex justify-between items-center">
                    <div>
                        <p class="font-bold text-lg">#${gameNum} - ${gameType}</p>
                        <p class="text-sm text-gray-600">Completed</p>
                    </div>
                    <p class="text-green-700 font-bold text-lg">✅</p>
                </div>
            `;
        }

        window.deleteGame = async function(gameId) {
            if (!confirm('❌ Are you sure? This will delete the game!')) return;

            try {
                // Delete tickets first (cascade)
                await supabaseClient.from('tickets').delete().eq('game_id', gameId);
                
                // Delete game
                const { error } = await supabaseClient
                    .from('games')
                    .delete()
                    .eq('id', gameId);

                if (error) {
                    alert('❌ Error: ' + error.message);
                    return;
                }

                alert('✅ Game deleted!');
                loadGames();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };

        window.addMoneyToUser = async function() {
            const email = document.getElementById('userEmail').value.trim();
            const amount = parseInt(document.getElementById('addAmount').value);

            if (!email || !amount || amount <= 0) {
                alert('❌ Enter valid email and amount!');
                return;
            }

            try {
                const { data: user } = await supabaseClient
                    .from('users')
                    .select('id, balance')
                    .eq('email', email)
                    .single();

                if (!user) {
                    alert('❌ User not found!');
                    return;
                }

                const newBalance = (user.balance || 0) + amount;

                const { error: updateError } = await supabaseClient
                    .from('users')
                    .update({ balance: newBalance })
                    .eq('id', user.id);

                if (updateError) {
                    alert('❌ Error updating balance: ' + updateError.message);
                    return;
                }

                const { error: transError } = await supabaseClient.from('transactions').insert({
                    user_id: user.id,
                    type: 'topup',
                    amount: amount
                });

                if (transError) {
                    alert('❌ Error adding transaction: ' + transError.message);
                    return;
                }

                alert('✅ Added ৳' + amount + ' to ' + email + '\n\nNew Balance: ৳' + newBalance);
                document.getElementById('userEmail').value = '';
                document.getElementById('addAmount').value = '';
                await loadAllUsers();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };

        async function loadWithdrawals() {
            try {
                const { data } = await supabaseClient
                    .from('withdrawals')
                    .select('*, users(name, email)')
                    .eq('status', 'pending')
                    .order('created_at', { ascending: false });

                const list = document.getElementById('withdrawalsList');
                list.innerHTML = data.length ? data.map(createWithdrawalCard).join('') : '<p class="text-center text-gray-600">No pending withdrawals</p>';
            } catch (error) {
                console.error('Load withdrawals error:', error);
            }
        }

        function createWithdrawalCard(withdrawal) {
            return `
                <div class="bg-yellow-50 p-4 rounded-lg border-2 border-yellow-400">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <p class="font-bold text-lg">${withdrawal.users.name}</p>
                            <p class="text-sm text-gray-600">${withdrawal.users.email}</p>
                        </div>
                        <p class="text-2xl font-bold text-yellow-700">৳${withdrawal.amount}</p>
                    </div>
                    <div class="flex justify-between items-center mb-3 text-sm">
                        <p><strong>Method:</strong> ${withdrawal.method}</p>
                        <p><strong>Account:</strong> ${withdrawal.account}</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="approveWithdrawal('${withdrawal.id}')" class="btn-press flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded font-bold text-sm">
                            ✅ Approve
                        </button>
                        <button onclick="rejectWithdrawal('${withdrawal.id}')" class="btn-press flex-1 bg-red-600 hover:bg-red-700 text-white py-2 rounded font-bold text-sm">
                            ❌ Reject
                        </button>
                    </div>
                </div>
            `;
        }

        window.approveWithdrawal = async function(withdrawalId) {
            if (!confirm('✅ Approve this withdrawal?')) return;

            try {
                await supabaseClient
                    .from('withdrawals')
                    .update({ status: 'completed' })
                    .eq('id', withdrawalId);

                alert('✅ Withdrawal approved!');
                loadWithdrawals();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };

        window.rejectWithdrawal = async function(withdrawalId) {
            if (!confirm('❌ Reject this withdrawal?')) return;

            try {
                await supabaseClient
                    .from('withdrawals')
                    .update({ status: 'rejected' })
                    .eq('id', withdrawalId);

                alert('✅ Withdrawal rejected!');
                loadWithdrawals();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };

        window.logout = async function() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        };
    </script>
</body>
</html>
