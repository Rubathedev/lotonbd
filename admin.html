<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LottoBD - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen p-4" style="background: linear-gradient(135deg, #E0F2F1 0%, #B2DFDB 100%);">
    <div id="accessDenied" class="hidden min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg border-2 border-red-500 text-center shadow-lg">
            <h1 class="text-3xl font-bold text-red-600 mb-4">🚫 ACCESS DENIED</h1>
            <a href="games.html" class="bg-teal-600 text-white px-6 py-3 rounded hover:bg-teal-700">Back to Games</a>
        </div>
    </div>

    <div id="adminContent" class="hidden">
        <div class="max-w-7xl mx-auto">
            <!-- Header -->
            <div class="bg-white p-6 rounded-lg border-2 border-teal-600 mb-6 shadow-lg">
                <div class="flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-teal-700">🔧 Admin Control Panel</h1>
                    <a href="games.html" class="bg-teal-600 text-white px-4 py-2 rounded hover:bg-teal-700 font-bold">← Back</a>
                </div>
            </div>

            <!-- CREATE GAMES SECTION -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <button onclick="createJuniorGames()" class="bg-teal-600 hover:bg-teal-700 text-white p-8 rounded-lg border-2 border-teal-700 shadow-lg text-center font-bold text-lg transform hover:scale-105 transition">
                    ✨ Create 10 Junior Games<br><span class="text-sm">৳200 per ticket</span>
                </button>
                
                <button onclick="createVIPGame()" class="bg-amber-500 hover:bg-amber-600 text-white p-8 rounded-lg border-2 border-amber-600 shadow-lg text-center font-bold text-lg transform hover:scale-105 transition">
                    💎 Create 1 VIP Game<br><span class="text-sm">৳1,000 per ticket</span>
                </button>
            </div>

            <!-- ADD MONEY SECTION -->
            <div class="bg-white p-6 rounded-lg border-2 border-green-600 mb-6 shadow-lg">
                <h2 class="text-xl font-bold text-green-700 mb-4">💰 Add Money to Customer</h2>
                
                <!-- Search Input -->
                <div class="mb-4">
                    <label class="block text-green-700 mb-2 font-semibold">Search Customer Email</label>
                    <div class="relative">
                        <input type="text" id="customerSearch" placeholder="Type 2+ letters..." 
                            oninput="searchCustomers()"
                            class="w-full px-4 py-2 bg-green-50 border-2 border-green-500 rounded text-gray-800 focus:outline-none">
                        
                        <!-- Autocomplete Suggestions -->
                        <div id="suggestions" class="hidden absolute z-10 w-full bg-white border-2 border-green-500 rounded mt-1 max-h-48 overflow-y-auto shadow-lg"></div>
                    </div>
                </div>

                <!-- Add Money Input -->
                <div id="amountSection" class="hidden mb-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-green-700 mb-2 text-sm font-semibold">Customer Name</label>
                            <input type="text" id="selectedName" readonly class="w-full px-3 py-2 bg-gray-100 border-2 border-gray-300 rounded text-gray-700">
                        </div>
                        <div>
                            <label class="block text-green-700 mb-2 text-sm font-semibold">Amount (৳)</label>
                            <input type="number" id="addAmount" placeholder="Enter amount" 
                                class="w-full px-3 py-2 bg-green-50 border-2 border-green-500 rounded text-gray-800 focus:outline-none">
                        </div>
                        <div class="flex items-end gap-2">
                            <button onclick="addMoneyToCustomer()" class="flex-1 bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded font-bold text-sm">
                                ✅ Add Money
                            </button>
                            <button onclick="clearCustomerSelection()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded font-bold text-sm">
                                ✕
                            </button>
                        </div>
                    </div>
                </div>

                <!-- All Customers List -->
                <div>
                    <label class="block text-green-700 mb-2 font-semibold">📋 All Customers (<span id="totalUsers">0</span>)</label>
                    <div id="customersList" class="bg-green-50 border-2 border-green-500 rounded max-h-72 overflow-y-auto space-y-1 p-2">
                        <p class="text-gray-600 text-center py-8">Loading customers...</p>
                    </div>
                </div>
            </div>

            <!-- ACTIVE GAMES SECTION -->
            <div class="bg-white p-6 rounded-lg border-2 border-teal-600 shadow-lg">
                <h2 class="text-xl font-bold text-teal-700 mb-4">📊 Active Games</h2>
                <div id="gamesList" class="space-y-2">
                    <p class="text-gray-600 text-center py-8">Loading games...</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://pnngnmbfbkbpzhsdpsmj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBubmdubWJmYmticHpoc2Rwc21qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NzU5MDgsImV4cCI6MjA4ODA1MTkwOH0.vIYdJA3eKajAGQ9Om27P8RkqTIeWUlGx1B-npq3u6u0';
        
        const ADMIN_USER_ID = 'cee05a83-4119-408f-af5f-21fa86caf8a9';
        
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        let selectedCustomerId = null;
        let allCustomers = [];

        // Initialize
        supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
            if (!session) {
                window.location.href = 'index.html';
                return;
            }

            if (session.user.id !== ADMIN_USER_ID) {
                document.getElementById('accessDenied').classList.remove('hidden');
                return;
            }

            document.getElementById('adminContent').classList.remove('hidden');
            await loadAllCustomers();
            await loadGames();

            // Refresh every 5 seconds
            setInterval(() => {
                loadGames();
                loadAllCustomers();
            }, 5000);
        });

        // ============ CUSTOMERS ============

        async function loadAllCustomers() {
            try {
                const { data } = await supabaseClient
                    .from('users')
                    .select('id, name, email, balance')
                    .order('created_at', { ascending: false });

                allCustomers = data || [];
                displayAllCustomers(allCustomers);
            } catch (error) {
                console.error('Load customers error:', error);
            }
        }

        function displayAllCustomers(customers) {
            const list = document.getElementById('customersList');
            document.getElementById('totalUsers').textContent = customers.length;

            if (customers.length === 0) {
                list.innerHTML = '<p class="text-gray-600 text-center py-8">No customers yet</p>';
                return;
            }

            list.innerHTML = '';
            customers.forEach(customer => {
                list.innerHTML += `
                    <div onclick="selectCustomer('${customer.id}', '${customer.name}', '${customer.email}')" 
                        class="bg-white p-3 rounded border border-green-400 cursor-pointer hover:bg-green-100 transition flex justify-between items-center">
                        <div>
                            <p class="text-gray-800 font-bold text-sm">${customer.name}</p>
                            <p class="text-xs text-gray-600">${customer.email}</p>
                        </div>
                        <p class="text-xs font-bold text-green-700">৳${customer.balance}</p>
                    </div>
                `;
            });
        }

        window.searchCustomers = function() {
            const searchTerm = document.getElementById('customerSearch').value.toLowerCase();
            const suggestionsDiv = document.getElementById('suggestions');

            if (searchTerm.length < 2) {
                suggestionsDiv.classList.add('hidden');
                displayAllCustomers(allCustomers);
                return;
            }

            const matches = allCustomers.filter(c => 
                c.email.toLowerCase().includes(searchTerm) || 
                c.name.toLowerCase().includes(searchTerm)
            );

            if (matches.length === 0) {
                suggestionsDiv.classList.add('hidden');
                displayAllCustomers(allCustomers);
                return;
            }

            suggestionsDiv.innerHTML = '';
            matches.slice(0, 8).forEach(customer => {
                suggestionsDiv.innerHTML += `
                    <div onclick="selectCustomer('${customer.id}', '${customer.name}', '${customer.email}')"
                        class="p-3 border-b border-green-200 cursor-pointer hover:bg-green-50 transition">
                        <p class="text-gray-800 font-bold text-sm">${customer.name}</p>
                        <p class="text-xs text-gray-600">${customer.email}</p>
                    </div>
                `;
            });

            suggestionsDiv.classList.remove('hidden');
            displayAllCustomers(matches);
        };

        window.selectCustomer = function(id, name, email) {
            selectedCustomerId = id;
            document.getElementById('customerSearch').value = email;
            document.getElementById('selectedName').value = name;
            document.getElementById('suggestions').classList.add('hidden');
            document.getElementById('amountSection').classList.remove('hidden');
            document.getElementById('addAmount').focus();
        };

        window.clearCustomerSelection = function() {
            selectedCustomerId = null;
            document.getElementById('customerSearch').value = '';
            document.getElementById('selectedName').value = '';
            document.getElementById('addAmount').value = '';
            document.getElementById('amountSection').classList.add('hidden');
            document.getElementById('suggestions').classList.add('hidden');
        };

        window.addMoneyToCustomer = async function() {
            if (!selectedCustomerId) {
                alert('Please select a customer first');
                return;
            }

            const amount = parseInt(document.getElementById('addAmount').value);
            if (!amount || amount <= 0) {
                alert('Please enter valid amount');
                return;
            }

            try {
                const { data: user } = await supabaseClient
                    .from('users')
                    .select('balance, name')
                    .eq('id', selectedCustomerId)
                    .single();

                if (!user) {
                    alert('Customer not found');
                    return;
                }

                const newBalance = user.balance + amount;
                
                const { error } = await supabaseClient
                    .from('users')
                    .update({ balance: newBalance })
                    .eq('id', selectedCustomerId);

                if (error) throw error;

                await supabaseClient.from('transactions').insert({
                    user_id: selectedCustomerId,
                    type: 'topup',
                    amount: amount
                });

                alert(`✅ Added ৳${amount} to ${user.name}\nNew balance: ৳${newBalance}`);
                
                await loadAllCustomers();
                clearCustomerSelection();

            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };

        // ============ GAMES ============

        async function loadGames() {
            try {
                const { data } = await supabaseClient
                    .from('games')
                    .select('*')
                    .eq('status', 'active')
                    .order('game_type', { ascending: true })
                    .order('game_number', { ascending: true });

                const gamesList = document.getElementById('gamesList');

                if (!data || data.length === 0) {
                    gamesList.innerHTML = '<p class="text-gray-600 text-center py-8">No active games. Create some!</p>';
                    return;
                }

                gamesList.innerHTML = '';

                data.forEach(game => {
                    const gameNum = String(game.game_number).padStart(2, '0');
                    const isJunior = game.game_type === 'junior';
                    const sold = game.tickets_sold || 0;
                    const percentFull = (sold / 10) * 100;
                    
                    const bgColor = isJunior ? 'bg-teal-50' : 'bg-amber-50';
                    const borderColor = isJunior ? 'border-teal-500' : 'border-amber-500';
                    const textColor = isJunior ? 'text-teal-700' : 'text-amber-700';
                    const barColor = isJunior ? 'bg-teal-600' : 'bg-amber-500';
                    const type = isJunior ? 'Junior' : '💎 VIP';
                    const price = isJunior ? '৳200' : '৳1,000';

                    gamesList.innerHTML += `
                        <div class="${bgColor} p-4 rounded-lg border-2 ${borderColor} flex justify-between items-center">
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-2">
                                    <h3 class="${textColor} font-bold text-lg">${type} #${gameNum}</h3>
                                    <span class="text-xs text-gray-600">${sold}/10</span>
                                </div>
                                <div class="w-40 bg-gray-300 rounded-full h-2">
                                    <div class="${barColor} h-2 rounded-full" style="width: ${percentFull}%"></div>
                                </div>
                            </div>
                            <div class="text-right ml-4">
                                <p class="text-gray-700 font-bold">${price}</p>
                                ${sold >= 10 ? '<p class="text-red-500 text-sm font-bold">FULL</p>' : '<p class="text-green-600 text-sm">Active</p>'}
                            </div>
                            <button onclick="deleteGame('${game.id}')" class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded font-bold ml-3 text-sm">
                                🗑️
                            </button>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Load games error:', error);
            }
        }

        window.createJuniorGames = async function() {
            if (!confirm('Create 10 junior games?')) return;

            try {
                const today = new Date().toISOString().split('T')[0];
                
                const { data: existing } = await supabaseClient
                    .from('games')
                    .select('game_number')
                    .eq('date', today)
                    .eq('game_type', 'junior')
                    .order('game_number', { ascending: false })
                    .limit(1);
                
                const startNum = existing && existing.length > 0 ? existing[0].game_number + 1 : 1;
                
                const games = [];
                for (let i = 0; i < 10; i++) {
                    games.push({
                        date: today,
                        game_number: startNum + i,
                        game_type: 'junior',
                        status: 'active',
                        tickets_sold: 0
                    });
                }

                const { error } = await supabaseClient.from('games').insert(games);
                
                if (error) throw error;
                
                alert('✅ 10 Junior games created!');
                await loadGames();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };

        window.createVIPGame = async function() {
            if (!confirm('Create 1 VIP game?')) return;

            try {
                const today = new Date().toISOString().split('T')[0];
                
                const { data: existing } = await supabaseClient
                    .from('games')
                    .select('game_number')
                    .eq('date', today)
                    .eq('game_type', 'vip')
                    .order('game_number', { ascending: false })
                    .limit(1);
                
                const gameNum = existing && existing.length > 0 ? existing[0].game_number + 1 : 1;

                const { error } = await supabaseClient.from('games').insert({
                    date: today,
                    game_number: gameNum,
                    game_type: 'vip',
                    status: 'active',
                    tickets_sold: 0
                });
                
                if (error) throw error;
                
                alert('✅ VIP game created!');
                await loadGames();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };

        window.deleteGame = async function(gameId) {
            if (!confirm('Delete this game? Cannot be undone!')) return;

            try {
                // Delete in correct order
                await supabaseClient.from('transactions').delete().eq('game_id', gameId);
                await supabaseClient.from('tickets').delete().eq('game_id', gameId);
                
                const { error } = await supabaseClient.from('games').delete().eq('id', gameId);

                if (error) throw error;

                alert('✅ Game deleted!');
                await loadGames();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };
    </script>
</body>
</html>
